<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Room — My Super Fantasy</title>
<meta name="description" content="Bring 2 to 16 fantasy football divisions into one super league. Live matchups, real-time point projections, combined standings, and a playoff bracket spanning your whole group.">
<meta name="theme-color" content="#0a0e13">
<link rel="canonical" href="https://mysuperfantasy.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="My Super Fantasy">
<meta property="og:url" content="https://mysuperfantasy.com/">
<meta property="og:title" content="League Room — Every division. One league room.">
<meta property="og:description" content="Live matchups, real-time point projections, and combined standings across every division in your fantasy football super league.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="League Room — Every division. One league room.">
<meta name="twitter:description" content="Live matchups, real-time point projections, and combined standings across every division in your fantasy football super league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9468106192958409" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0a0e13; --panel:#121821; --panel-alt:#171f2a; --line:#232d3a;
    --text:#edf1f5; --text-dim:#8b98a8; --text-faint:#5b6675;
    --div1:#4c8bf5; --div1-dim:#2a4770; --div2:#ff6b4a; --div2-dim:#7a3a2a;
    --gold:#d4af37; --gold-dim:#4a3f1f; --live:#3ecf8e; --danger:#e8544a; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;
    background-image:radial-gradient(circle at 15% 0%, rgba(76,139,245,0.07), transparent 40%),radial-gradient(circle at 85% 10%, rgba(255,107,74,0.07), transparent 40%);
    background-attachment:fixed;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;margin:0;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  button,input,select{font-family:inherit;}
  button{cursor:pointer;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  #app{max-width:1040px;margin:0 auto;padding:24px 18px 80px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--div1),var(--div2));display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:15px;color:#0a0e13;}
  .brand-name{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;}
  .backlink{display:flex;align-items:center;gap:6px;font-family:'Oswald';font-size:13px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-dim);padding:8px 12px;border:1px solid var(--line);border-radius:8px;}
  .backlink:hover{border-color:var(--text-dim);color:var(--text);}
  .topbar-actions{display:flex;gap:8px;align-items:center;}

  .hero{margin:36px 0 30px;}
  .hero-eyebrow{font-family:'Oswald';font-size:12px;letter-spacing:0.28em;color:var(--live);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);}
  .hero h1{font-size:clamp(32px,6vw,50px);line-height:1.03;font-weight:700;}
  .hero p{color:var(--text-dim);margin-top:12px;font-size:15px;max-width:560px;line-height:1.6;}

  .search-bar{display:flex;gap:8px;margin:22px 0 8px;}
  .search-bar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--text);font-size:14px;}
  .search-bar input:focus{outline:none;border-color:var(--live);}
  .search-results{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .search-result{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;}
  .search-result:hover{border-color:var(--live);}
  .sr-name{font-weight:700;font-size:14px;}
  .sr-meta{color:var(--text-faint);font-size:12px;margin-top:2px;}

  .action-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:24px 0;}
  @media(max-width:760px){.action-row{grid-template-columns:1fr;}}
  .action-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.15s;}
  .action-card:hover{border-color:var(--live);transform:translateY(-2px);}
  .action-card .ac-title{font-size:18px;font-weight:700;margin-bottom:4px;}
  .action-card .ac-sub{color:var(--text-faint);font-size:12.5px;}

  .form-group{margin-bottom:16px;}
  .form-label{font-family:'Oswald';font-size:11.5px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;display:block;}
  .form-input,.form-select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;}
  .form-input:focus,.form-select:focus{outline:none;border-color:var(--live);}
  .form-hint{color:var(--text-faint);font-size:11.5px;margin-top:5px;}
  .tabs-row{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;color:var(--text-faint);font-family:'Oswald';font-size:13px;letter-spacing:0.05em;text-transform:uppercase;padding:10px 4px;border-bottom:2px solid transparent;margin-right:14px;}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--live);}
  .tab-btn:hover{color:var(--text);}
  .form-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.form-row2{grid-template-columns:1fr;}}

  .primary-btn{background:var(--live);color:#0a0e13;border:none;border-radius:9px;padding:13px 22px;font-family:'Oswald';font-size:13.5px;letter-spacing:0.05em;text-transform:uppercase;font-weight:700;}
  .primary-btn:hover{filter:brightness(1.08);}
  .primary-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .secondary-btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 18px;font-family:'Oswald';font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;}
  .secondary-btn:hover{border-color:var(--text-dim);}
  .ghost-btn{background:transparent;color:var(--text-faint);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:'Oswald';font-size:11.5px;}

  .division-fields{background:var(--panel-alt);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
  .division-fields-head{font-family:'Oswald';font-size:12px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}

  .alert{padding:12px 14px;border-radius:8px;font-size:13px;margin:12px 0;}
  .alert.error{background:rgba(232,84,74,0.12);color:#ff9a91;border:1px solid rgba(232,84,74,0.3);}
  .alert.success{background:rgba(62,207,142,0.12);color:#8fe8bd;border:1px solid rgba(62,207,142,0.3);}
  .alert.info{background:rgba(76,139,245,0.1);color:#a8c6fb;border:1px solid rgba(76,139,245,0.3);}

  .tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0;}
  .tile{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;}
  .tile:hover{transform:translateY(-2px);border-color:var(--live);}
  .tile-bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--div1);}
  .tile-label{font-family:'Oswald';font-size:11px;letter-spacing:0.15em;color:var(--text-dim);margin-bottom:4px;}
  .tile-title{font-size:18px;font-weight:600;}
  .tile-sub{color:var(--text-faint);font-size:11.5px;margin-top:8px;}
  .tile.super{background:linear-gradient(120deg, rgba(212,175,55,0.10), var(--panel) 55%);border:1px solid var(--gold-dim);}
  .tile.super .tile-bar{background:var(--gold);}
  .tile.super .tile-title{color:var(--gold);}
  .platform-chip{font-family:'Oswald';font-size:9px;letter-spacing:0.08em;padding:2px 6px;border-radius:4px;background:var(--panel-alt);color:var(--text-faint);text-transform:uppercase;}

  .section-label{font-family:'Oswald';font-size:12px;letter-spacing:0.15em;color:var(--text-faint);text-transform:uppercase;margin:30px 0 10px;}
  table.standings{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.standings th{text-align:left;color:var(--text-faint);font-family:'Oswald';font-weight:500;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);}
  table.standings td{padding:10px;border-bottom:1px solid rgba(35,45,58,0.5);}
  table.standings td.num,table.standings th.num{text-align:right;}
  .table-scroll{overflow-x:auto;}
  .rank-cell{width:28px;color:var(--text-faint);font-family:'Oswald';}
  .team-cell{display:flex;align-items:center;gap:9px;}
  .avatar-fallback{width:26px;height:26px;border-radius:6px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-faint);flex:none;}
  .avatar{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:none;}
  .team-name{font-weight:600;}
  .owner-name{color:var(--text-faint);font-size:11.5px;}
  .leader-row td{background:linear-gradient(90deg, rgba(212,175,55,0.10), transparent);}
  .crown{color:var(--gold);font-size:12px;margin-right:2px;}
  .div-chip{font-family:'Oswald';font-size:9px;letter-spacing:0.08em;padding:2px 6px;border-radius:4px;color:#0a0e13;font-weight:700;background:var(--div1);}

  .matchup-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .matchup-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px;gap:12px;}
  .mt-team{display:flex;align-items:center;gap:10px;min-width:0;}
  .mt-team.right{flex-direction:row-reverse;text-align:right;}
  .mt-avatar,.mt-avatar-fallback{width:36px;height:36px;border-radius:9px;background:var(--panel-alt);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-faint);}
  .mt-info{min-width:0;}
  .mt-team-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mt-record{color:var(--text-faint);font-size:11px;}
  .mt-score{font-family:'Oswald';font-size:26px;font-weight:600;}
  .mt-team.loser .mt-score,.mt-team.loser .mt-team-name{color:var(--text-faint);}
  .mt-center{text-align:center;color:var(--text-faint);}
  .mt-vs{font-family:'Oswald';font-size:10px;letter-spacing:0.15em;}
  .injury-tag{font-family:'Oswald';font-size:8.5px;padding:1px 4px;border-radius:3px;margin-left:5px;text-transform:uppercase;}
  .injury-tag.q{background:rgba(212,175,55,0.2);color:var(--gold);}
  .injury-tag.out,.injury-tag.ir{background:rgba(232,84,74,0.2);color:#ff9a91;}
  .injury-tag.d{background:rgba(232,84,74,0.15);color:#ff9a91;}

  .expand-row{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-top:1px solid var(--line);font-family:'Oswald';font-size:11px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;}
  .expand-row:hover{color:var(--text);background:var(--panel-alt);}
  .roster-detail{display:none;border-top:1px solid var(--line);padding:14px 18px;}
  .roster-detail.open{display:block;}
  .roster-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;}
  @media(max-width:560px){.roster-grid{grid-template-columns:1fr;gap:16px 0;}}
  .roster-col-head{font-family:'Oswald';font-size:10.5px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;padding:8px 0 6px;border-bottom:1px solid var(--line);margin-bottom:2px;}
  .roster-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed rgba(35,45,58,0.6);gap:6px;}
  .rp-name{display:flex;gap:7px;align-items:center;min-width:0;}
  .rp-pos{font-family:'Oswald';font-size:9px;color:var(--text-faint);background:var(--panel-alt);padding:1px 5px;border-radius:4px;flex:none;min-width:24px;text-align:center;}
  .rp-player{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rp-proj{color:var(--text-faint);font-size:10.5px;margin-left:4px;}
  .rp-pts{font-family:'Oswald';flex:none;}
  .rp-scores{display:flex;align-items:baseline;gap:8px;flex:none;}
  .rp-proj-val{font-family:'Oswald';font-size:11px;color:var(--text-faint);min-width:30px;text-align:right;}
  .rp-proj-val.playing{color:var(--live);}
  .rp-pts{min-width:34px;text-align:right;}
  .roster-col-sub{display:flex;justify-content:flex-end;gap:8px;font-family:'Oswald';font-size:8.5px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;padding-bottom:2px;}
  .roster-col-sub span:first-child{min-width:30px;text-align:right;}
  .roster-col-sub span:last-child{min-width:34px;text-align:right;}
  .rp-gamestate{font-family:'Oswald';font-size:8.5px;color:var(--text-faint);letter-spacing:0.04em;margin-left:5px;white-space:nowrap;}
  .rp-gamestate.playing{color:var(--live);}

  /* live projections */
  .mt-side{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .mt-proj{font-family:'Oswald';font-size:10px;letter-spacing:0.06em;color:var(--text-faint);text-transform:uppercase;white-space:nowrap;}
  .mt-proj.playing{color:var(--live);}
  .mt-proj.winning{color:var(--gold);}
  .live-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 2px;}
  .live-pill{display:inline-flex;align-items:center;gap:7px;font-family:'Oswald';font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-faint);border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;}
  .live-pill.on{color:var(--live);border-color:rgba(62,207,142,0.35);}
  .live-pill .dot-live{background:var(--text-faint);box-shadow:none;}
  .live-pill.on .dot-live{background:var(--live);box-shadow:0 0 8px var(--live);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .refresh-btn{background:transparent;color:var(--text-faint);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-family:'Oswald';font-size:11px;letter-spacing:0.09em;text-transform:uppercase;}
  .refresh-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .refresh-btn:disabled{opacity:0.5;cursor:default;}
  @keyframes ptsflash{0%{color:var(--live);transform:scale(1.06);}100%{color:inherit;transform:scale(1);}}
  .flash{animation:ptsflash 1.1s ease-out;}
  @media(prefers-reduced-motion:reduce){.flash{animation:none;}.live-pill.on .dot-live{animation:none;}}

  .week-tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0;margin-bottom:4px;border-bottom:1px solid var(--line);}
  .week-tab{flex:none;font-family:'Oswald';font-size:12.5px;color:var(--text-faint);background:transparent;border:1px solid var(--line);padding:7px 13px;border-radius:20px;white-space:nowrap;}
  .week-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;}

  .subnav{display:flex;gap:4px;overflow-x:auto;margin:16px 0 4px;border-bottom:1px solid var(--line);}
  .subnav a{flex:none;font-family:'Oswald';font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);padding:9px 13px;border-bottom:2px solid transparent;white-space:nowrap;}
  .subnav a.active{color:var(--text);border-bottom-color:var(--text);}
  .subnav a:hover{color:var(--text);}
  .subnav a.gold{color:var(--gold);}
  .subnav a.gold.active{border-bottom-color:var(--gold);}
  .subnav{position:sticky;top:0;z-index:5;background:var(--bg);}

  .state-msg{color:var(--text-faint);font-size:13px;padding:26px 4px;text-align:center;}
  .state-msg.error{color:var(--danger);}
  .footnote{color:var(--text-faint);font-size:11.5px;text-align:center;margin-top:30px;line-height:1.6;}
  .skeleton{background:linear-gradient(90deg,var(--panel-alt) 25%, #1e2733 37%, var(--panel-alt) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  .roster-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media(max-width:700px){.roster-cards{grid-template-columns:1fr;}}
  .roster-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .roster-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .roster-card-title{font-weight:700;font-size:14px;}
  .roster-card-sub{color:var(--text-faint);font-size:11px;}
  .roster-section-head{font-family:'Oswald';font-size:10px;letter-spacing:0.14em;color:var(--text-faint);text-transform:uppercase;margin:12px 0 4px;}

  .draft-round{margin-bottom:20px;}
  .draft-round-head{font-family:'Oswald';font-size:12px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .draft-pick-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:13px;}
  .dp-num{font-family:'Oswald';color:var(--text-faint);}
  .dp-player{font-weight:600;}
  .dp-meta{color:var(--gold);font-size:11px;margin-top:2px;}
  .dp-team{color:var(--text-faint);font-size:11.5px;text-align:right;flex:none;}

  .bracket-scroll{display:flex;gap:28px;overflow-x:auto;padding:6px 4px 16px;}
  .bracket-col{flex:none;width:220px;display:flex;flex-direction:column;justify-content:space-around;gap:20px;}
  .bracket-col-head{font-family:'Oswald';font-size:11px;letter-spacing:0.12em;color:var(--text-dim);text-transform:uppercase;text-align:center;margin-bottom:4px;}
  .bracket-pair{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .bracket-slot{display:flex;align-items:center;padding:9px 11px;font-size:12.5px;gap:7px;}
  .bracket-slot+.bracket-slot{border-top:1px solid var(--line);}
  .bracket-slot.winner{background:rgba(62,207,142,0.09);}
  .bracket-slot.winner .bname{color:#fff;font-weight:700;}
  .bracket-slot.loser{opacity:0.5;}
  .bseed{font-family:'Oswald';font-weight:700;font-size:10px;color:var(--text-faint);width:18px;height:18px;border-radius:5px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;flex:none;}
  .bname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bye-slot{padding:9px 11px;font-size:11px;color:var(--text-faint);font-style:italic;}
  .champion-box{margin-top:8px;background:linear-gradient(135deg, rgba(212,175,55,0.14), var(--panel) 60%);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:22px;text-align:center;}
  .champion-label{font-family:'Oswald';font-size:11px;letter-spacing:0.16em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .champion-name{font-family:'Oswald';font-size:24px;font-weight:700;}

  .commish-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-dim);color:var(--gold);font-family:'Oswald';font-size:11px;letter-spacing:0.06em;padding:5px 10px;border-radius:6px;text-transform:uppercase;}
  .lock-badge{display:inline-flex;align-items:center;gap:5px;color:var(--text-faint);font-size:11.5px;}

  @media(max-width:480px){
    #app{padding:16px 12px 60px;}
    .mt-avatar,.mt-avatar-fallback{width:30px;height:30px;}
    .mt-score{font-size:20px;}
    .action-row{gap:10px;}
    .bracket-col{width:190px;}
  }
</style>
</head>
<body>
<div id="app"></div>

/* ============================ LIVE PROJECTIONS ============================
   A player's live projection is what they're on pace to finish the week with:

     projected = points already scored + (full-week projection x share of game left)

   Before kickoff that's the full projection; at the final whistle it collapses to
   the actual score; mid-game it decays as the clock runs down. Weekly projections
   come back as raw stat lines, so we price them with each league's own scoring
   settings rather than assuming PPR.                                           */

const PROJ_POSITIONS = ['QB','RB','WR','TE','K','DEF'];
const SCORES_TTL_MS = 20000;
const liveCache = { proj:{}, projPromise:{}, scoresByTeam:{}, scoresKey:null, scoresAt:0, scoresPromise:null };

async function sleeperData(path){
  const res = await fetch(SLEEPER_DATA + path);
  if(!res.ok) throw new Error('Sleeper error ' + res.status);
  return res.json();
}

/* Weekly projections never change once published, so fetch each week at most once. */
function ensureProjections(season, week){
  const key = season + '-' + week;
  if(liveCache.proj[key]) return Promise.resolve(liveCache.proj[key]);
  if(liveCache.projPromise[key]) return liveCache.projPromise[key];
  const qs = PROJ_POSITIONS.map(p=>'position[]='+p).join('&');
  liveCache.projPromise[key] = sleeperData(`/projections/nfl/${season}/${week}?season_type=regular&${qs}&order_by=ppr`)
    .then(rows=>{
      const byId = {};
      (rows||[]).forEach(r=>{ if(r.player_id && r.stats) byId[r.player_id] = r.stats; });
      liveCache.proj[key] = byId;
      return byId;
    })
    .catch(e=>{ delete liveCache.projPromise[key]; throw e; });
  return liveCache.projPromise[key];
}

/* Live game clocks. Short TTL so a burst of callers shares one request. */
function refreshScores(season, week, force){
  const key = season + '-' + week;
  const fresh = liveCache.scoresKey===key && (Date.now()-liveCache.scoresAt) < SCORES_TTL_MS;
  if(fresh && !force) return Promise.resolve(liveCache.scoresByTeam);
  if(liveCache.scoresPromise) return liveCache.scoresPromise;
  liveCache.scoresPromise = sleeperData(`/scores/nfl/regular/${season}/${week}`)
    .then(games=>{
      const byTeam = {};
      (games||[]).forEach(g=>{
        const m = g.metadata || {};
        if(m.home_team) byTeam[m.home_team] = g;
        if(m.away_team) byTeam[m.away_team] = g;
      });
      liveCache.scoresByTeam = byTeam; liveCache.scoresKey = key; liveCache.scoresAt = Date.now();
      return byTeam;
    })
    .finally(()=>{ liveCache.scoresPromise = null; });
  return liveCache.scoresPromise;
}

function gameForPlayer(pid){
  const p = (sleeperCache.players && sleeperCache.players[pid]) || null;
  // Team defenses use the team abbreviation as their player id.
  const team = (p && p.team) || (/^[A-Z]{2,3}$/.test(pid) ? pid : null);
  return team ? (liveCache.scoresByTeam[team] || null) : null;
}

/* Share of the player's game still to be played, 0–1. */
function fractionRemaining(game){
  if(!game) return 0;                       // bye week, or no game found
  const m = game.metadata || {};
  if(m.is_over || game.status==='complete' || m.status==='closed') return 0;
  if(!m.has_started || game.status==='pre_game') return 1;
  if(m.is_overtime) return 0.03;            // sudden death — assume nearly done
  const q = parseInt(m.quarter_num, 10);
  if(!q) return 1;
  const bits = String(m.time_remaining || '0:00').split(':');
  const secs = (parseInt(bits[0],10)||0)*60 + (parseInt(bits[1],10)||0);
  const remaining = Math.max(0, (4-q)*900 + secs);
  return Math.max(0, Math.min(1, remaining/3600));
}

function gameStateLabel(game){
  if(!game) return '';
  const m = game.metadata || {};
  if(m.is_over || game.status==='complete') return 'Final';
  if(!m.has_started || game.status==='pre_game') return '';
  if(m.is_overtime) return 'OT';
  const q = parseInt(m.quarter_num,10);
  if(!q) return '';
  const t = String(m.time_remaining||'').trim();
  return 'Q'+q + (t && t!=='00:00' ? ' '+t.replace(/^0/,'') : '');
}

/* Price a raw projected stat line using the league's scoring settings. */
function projectedPoints(stats, scoring){
  if(!stats) return 0;
  if(scoring && Object.keys(scoring).length){
    let total = 0;
    for(const key in scoring){
      const v = stats[key];
      if(typeof v === 'number') total += v * scoring[key];
    }
    return total;
  }
  return stats.pts_ppr || stats.pts_half_ppr || stats.pts_std || 0;
}

/* Everything the UI needs for one starter. */
function playerLive(pid, actualPts, scoring, season, week){
  const table = liveCache.proj[season + '-' + week];
  const full = table ? projectedPoints(table[pid], scoring) : 0;
  const game = gameForPlayer(pid);
  const frac = fractionRemaining(game);
  return {
    actual: actualPts || 0,
    projected: (actualPts || 0) + full * frac,
    full, frac, game,
    playing: frac > 0 && frac < 1,
    yetToPlay: frac >= 1,
    hasProjection: !!(table && table[pid])
  };
}

/* ============================ AUTO-REFRESH LOOP ============================
   One loop at a time, owned by whichever view is on screen. Every render()
   tears the previous one down, and a generation counter makes sure a response
   that lands after the user has navigated away is discarded instead of
   painting into a detached DOM.                                              */

const LIVE_INTERVAL_ACTIVE = 30000;   // a game is in progress
const LIVE_INTERVAL_IDLE   = 300000;  // current week, but nothing kicked off
const live = { timer:null, clock:null, ctx:null, gen:0, busy:false, lastAt:0, anyLive:false };

function stopLive(){
  if(live.timer){ clearTimeout(live.timer); live.timer = null; }
  if(live.clock){ clearInterval(live.clock); live.clock = null; }
  live.ctx = null; live.busy = false; live.anyLive = false; live.gen++;
}

function startLive(ctx){
  // A view that was navigated away from mid-load must not install a loop.
  if(ctx.anchor && !document.body.contains(ctx.anchor)) return;
  if(live.timer){ clearTimeout(live.timer); live.timer = null; }
  if(live.clock){ clearInterval(live.clock); live.clock = null; }
  live.gen++; ctx.gen = live.gen; live.ctx = ctx; live.busy = false;
  live.lastAt = Date.now();
  live.clock = setInterval(updateLiveStatus, 10000);
  updateLiveStatus();
  scheduleLive();
}

function scheduleLive(){
  if(live.timer){ clearTimeout(live.timer); live.timer = null; }
  if(!live.ctx || !live.ctx.pollable) return;
  live.timer = setTimeout(tickLive, live.anyLive ? LIVE_INTERVAL_ACTIVE : LIVE_INTERVAL_IDLE);
}

async function tickLive(manual){
  const ctx = live.ctx;
  if(!ctx || live.busy) return;
  if(ctx.anchor && !document.body.contains(ctx.anchor)){ stopLive(); return; }
  if(!ctx.pollable && !manual) return;
  // Don't burn requests on a background tab; we refresh the moment it's shown again.
  if(document.hidden && !manual){ scheduleLive(); return; }
  const gen = ctx.gen;
  live.busy = true;
  updateLiveStatus('refreshing');
  try{
    await ctx.refresh();
    if(gen !== live.gen) return;
    live.lastAt = Date.now();
  }catch(e){
    // Transient blip — leave the last good numbers up rather than blanking them.
    console.warn('Live refresh failed', e);
  }finally{
    if(gen === live.gen){ live.busy = false; updateLiveStatus(); scheduleLive(); }
  }
}

function agoText(ts){
  if(!ts) return 'just now';
  const s = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s < 5) return 'just now';
  if(s < 60) return s + 's ago';
  const m = Math.round(s/60);
  return m + (m===1 ? ' min ago' : ' mins ago');
}

function updateLiveStatus(state){
  const el = document.getElementById('liveStatus');
  if(!el) return;
  const ctx = live.ctx;
  const btn = document.getElementById('liveRefreshBtn');
  if(btn) btn.disabled = !!live.busy;
  if(!ctx){ el.innerHTML = ''; el.className = 'live-pill'; return; }
  let text;
  if(state === 'refreshing') text = 'Updating…';
  else if(!ctx.pollable) text = ctx.idleText || 'Week complete';
  else if(live.anyLive) text = 'Live · ' + agoText(live.lastAt);
  else text = 'Auto-updating · ' + agoText(live.lastAt);
  el.className = 'live-pill' + (live.anyLive && state!=='refreshing' ? ' on' : '');
  el.innerHTML = `<span class="dot-live"></span>${escapeHtml(text)}`;
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || !live.ctx || !live.ctx.pollable) return;
  // Catch up on whatever happened while the tab was in the background.
  if(Date.now() - live.lastAt > LIVE_INTERVAL_ACTIVE) tickLive(true);
  else updateLiveStatus();
});

function entryLive(entry, scoring, season, week){
  const starters = entry.starters || [];
  const pts = entry.starters_points || [];
  const rows = starters.map((pid,i)=> ({ pid, ...playerLive(pid, pts[i], scoring, season, week) }));
  // Sleeper's own matchup total is authoritative for points already banked.
  const actual = entry.points != null ? entry.points : rows.reduce((s,r)=>s+r.actual,0);
  const delta = rows.reduce((s,r)=>s + r.full*r.frac, 0);
  return { rows, actual, projected: actual + delta, anyPlaying: rows.some(r=>r.playing) };
}

/* ============================ ROUTER ============================ */
window.addEventListener('hashchange', render);

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [pathPart, queryPart] = h.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart) queryPart.split('&').forEach(pair=>{ const [k,v]=pair.split('='); query[k]=decodeURIComponent(v||''); });
  if(parts[0]==='create') return {view:'create'};
  if(parts[0]==='account' || parts[0]==='commissioner') return {view:'account', returnCode: query.code||'', returnName: query.name||''};
  if(parts[0]==='join') return {view:'join', code: query.code||'', name: query.name||''};
  if(parts[0]==='league' && parts[1]) return {view:'league', slug:parts[1], sub:parts[2], arg:parts[3]};
  return {view:'landing'};
}

async function render(){
  const r = route();
  const app = document.getElementById('app');
  stopLive(); // every view owns at most one refresh loop
  try{
    if(r.view==='landing') await renderLanding(app);
    else if(r.view==='create') await renderCreate(app);
    else if(r.view==='account') await renderAccount(app, r.returnCode, r.returnName);
    else if(r.view==='join') await renderJoin(app, r.code, r.name);
    else if(r.view==='league') await renderLeagueRoute(app, r);
    focusActiveNav();
  }catch(err){
    console.error(err);
    app.innerHTML = topbarHtml() + `<div class="state-msg error">Something went wrong — ${escapeHtml(err.message||'unknown error')}</div>`;
  }
}

/* On narrow screens the sub-nav scrolls sideways, so bring the current tab into
   view rather than leaving the user looking at a bar that seems unrelated.
   Sets scrollLeft directly — scrollIntoView would also jump the page vertically. */
function focusActiveNav(){
  const active = document.querySelector('.subnav a.active');
  if(!active) return;
  const bar = active.parentElement;
  if(bar.scrollWidth <= bar.clientWidth) return;
  bar.scrollLeft = Math.max(0, active.offsetLeft - (bar.clientWidth - active.offsetWidth)/2);
}

/* Sub-navigation shared by every page inside a league, so the live view is
   always one tap from the overview, a sibling division, or the bracket. */

  const item = (href, label, key, cls) =>
    `<a href="${href}" class="${key===active?'active':''}${cls?' '+cls:''}">${escapeHtml(label)}</a>`;

}

async function doSearch(q){
  const el = document.getElementById('searchResults');
  if(!q){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="state-msg">Searching…</div>`;
  const needle = q.toLowerCase();
  const builtins = BUILTIN_LEAGUES.filter(l=> l.is_public && l.name.toLowerCase().includes(needle));
  try{
    const rows = await sbFetch(`/rest/v1/leagues?name=ilike.*${encodeURIComponent(q)}*&select=name,slug,num_divisions,created_at&order=created_at.desc&limit=15`);
    const found = [...builtins.map(l=>searchResultHtml(l,'Built-in')), ...((rows||[]).map(l=>searchResultHtml(l)))];
    if(!found.length){ el.innerHTML = `<div class="state-msg">No leagues found matching "${escapeHtml(q)}".</div>`; return; }
    el.innerHTML = found.join('');
  }catch(e){
    // The database may be unreachable, but built-in leagues still resolve.
    el.innerHTML = builtins.length
      ? builtins.map(l=>searchResultHtml(l,'Built-in')).join('')
      : `<div class="state-msg error">Search failed — check your connection and try again.</div>`;
  }
}

              <option value="yahoo">Yahoo Fantasy</option>
              <option value="nfl">NFL.com Fantasy</option>

            </select>
          </div>
        </div>
        <div class="form-group dv-idfield"><label class="form-label">League ID</label><input class="form-input dv-extid" placeholder="Sleeper League ID"></div>
        <div class="form-group dv-espnfields" style="display:none;">
          <label class="form-label">ESPN Cookies (private leagues only)</label>
          <div class="form-row2">
            <input class="form-input dv-espn-s2" placeholder="espn_s2 value">

      const idField = card.querySelector('.dv-idfield');
      const espnFields = card.querySelector('.dv-espnfields');
      const idInput = card.querySelector('.dv-extid');
      function updatePlaceholder(){
        const p = platformSel.value;
        idField.style.display = p==='manual' ? 'none' : '';
        espnFields.style.display = p==='espn' ? '' : 'none';
        idInput.placeholder = p==='sleeper' ? 'Sleeper League ID' : p==='espn' ? 'ESPN League ID' : p==='yahoo' ? 'Yahoo League ID (manual sync for now)' : 'NFL.com League ID (manual sync for now)';
      }
      platformSel.addEventListener('change', updatePlaceholder);
      updatePlaceholder();
    });

  numDivInput.addEventListener('change', renderDivisionFields);
  renderDivisionFields();

  document.getElementById('createForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const alertEl = document.getElementById('createAlert');
    const submitBtn = document.getElementById('submitBtn');
    alertEl.innerHTML = '';

    const name = document.getElementById('f_name').value.trim();
    const email = document.getElementById('f_email').value.trim();
    const password = document.getElementById('f_password').value;
    const isPublic = document.getElementById('f_public').checked;
    const numDiv = parseInt(numDivInput.value);
    const playoffWeeks = parseInt(document.getElementById('f_playoffweeks').value);
    const advance = parseInt(document.getElementById('f_advance').value);

    if(!name || password.length<6){

    if(!email || !email.includes('@')){

      if(slug.length < 2){ throw new Error('Please use a league name with at least a couple of letters or numbers.'); }

      const authData = await authSignUp(email, password);
      const token = authData.access_token;
      const uid = authData.user ? authData.user.id : decodeJwtSub(token);
      session = { access_token: token, user_id: uid, email };

      const inviteCode = String(Math.floor(100000 + Math.random()*900000));

      const leagueRows = await sbFetch('/rest/v1/leagues', {
        method:'POST',
        headers:{ Authorization:'Bearer '+token, Prefer:'return=representation' },
        body: JSON.stringify({ name, slug, email, commissioner_id: uid, num_divisions:numDiv, playoff_length_weeks:playoffWeeks, playoff_advance_count:advance, invite_code: inviteCode, is_public: isPublic })
      });
      const league = leagueRows[0];

      const divRows = await sbFetch('/rest/v1/divisions', {
        method:'POST',
        headers:{ Authorization:'Bearer '+token, Prefer:'return=representation' },
        body: JSON.stringify(divisions.map(d=>({ league_id:league.id, name:d.name, platform:d.platform, external_league_id:d.external_league_id, sort_order:d.sort_order })))
      });

      const espnInserts = divisions.map((d,i)=> d.platform==='espn' && d.espn_s2 && d.swid ? { division_id: divRows[i].id, espn_s2:d.espn_s2, swid:d.swid } : null).filter(Boolean);
      if(espnInserts.length){
        await sbFetch('/rest/v1/espn_credentials', { method:'POST', headers:{ Authorization:'Bearer '+token, Prefer:'return=minimal' }, body: JSON.stringify(espnInserts) });
      }

      location.hash = `#/league/${slug}/manage`;
    }catch(err){
      alertEl.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false; submitBtn.textContent = 'Create League';
    }
  });
}

async function getLeagueBySlug(slug){

  const rows = await sbFetch(`/rest/v1/leagues?slug=eq.${encodeURIComponent(slug)}&select=*`);
  return rows && rows[0] ? rows[0] : null;

async function getDivisions(leagueId){
  const builtin = builtinById(leagueId);

async function renderLeagueHome(app, league, divisions){
  const isCommish = session && session.user_id === league.commissioner_id;
  app.innerHTML = topbarHtml('#/', isCommish ? `<a class="secondary-btn" href="#/league/${league.slug}/manage">Manage League</a>` : '')

    <div class="hero" style="margin:10px 0 8px;">
      <h1 style="font-size:clamp(26px,5vw,38px);">${escapeHtml(league.name)}</h1>
      <p>${divisions.length} divisions &middot; Top ${league.playoff_advance_count} make the playoffs &middot; ${league.playoff_length_weeks}-week playoff bracket</p>
    </div>
    <div class="tiles-grid" id="divTiles">
      ${divisions.map(d=>`<a class="tile" href="#/league/${league.slug}/division/${d.id}">
        <div class="tile-bar"></div>
        <div><div class="tile-label">${escapeHtml(d.name)}</div><div class="platform-chip">${platformLabel[d.platform]||d.platform}</div></div>
      </a>`).join('')}
      <a class="tile super" href="#/league/${league.slug}/superbracket">
        <div class="tile-bar"></div>
        <div><div class="tile-label" style="color:var(--gold);">COMBINED</div><div class="tile-title">&#9819; Super League</div></div>
      </a>
    </div>
    <div class="section-label">Super League Standings</div>
    <div class="live-bar">
      <div class="live-pill" id="liveStatus"></div>
      <button class="refresh-btn" id="liveRefreshBtn">Refresh now</button>
    </div>
    <div id="superStandings"><div class="state-msg">Loading combined standings…</div></div>
    <div class="footnote">Standings combine every division. Each division's #1 seed is guaranteed a top spot; everyone else is ranked by record. Records and points update automatically as games finish — open a division for live scores and projections.</div>
  `;

  const paintStandings = ()=>{
    const el = document.getElementById('superStandings');
    if(el) renderStandingsTable(el, combineStandings(divisions), true);
  };

  await loadAllSleeperTeams(divisions);
  paintStandings();

  const hasSleeper = divisions.some(d=>d.platform==='sleeper' && d.external_league_id);
  document.getElementById('liveRefreshBtn').addEventListener('click', ()=> tickLive(true));
  startLive({
    anchor: document.getElementById('superStandings'),
    pollable: hasSleeper,
    idleText: 'No live divisions',
    refresh: async ()=>{
      await loadAllSleeperTeams(divisions, true);
      paintStandings();
      // Reflect whether anything is actually being played right now.
      try{
        const state = await ensureNflState();
        const byTeam = await refreshScores(state.season, state.week, true);
        live.anyLive = Object.values(byTeam).some(g=> (g.metadata||{}).is_in_progress);
      }catch(e){ /* pill just stays in its idle style */ }
    }
  });
}

async function loadAllSleeperTeams(divisions, force){
  const sleeperDivs = divisions.filter(d=>d.platform==='sleeper' && d.external_league_id);
  await Promise.all(sleeperDivs.map(async d=>{
    try{ await ensureSleeperBasics(d, force); }catch(e){ /* ignore individual failures */ }
  }));
}

function combineStandings(divisions){
  const groups = divisions.map(d=>{
    const c = divCache(d.id);
    if(!c.info || !c.rosters) return { division:d, teams:[] };
    return { division:d, teams: teamsForDivision(d).sort(compareTeams) };
  }).filter(g=>g.teams.length);
  if(!groups.length) return [];
  const leaders = groups.map(g=>g.teams[0]).sort(compareTeams);
  const rest = groups.flatMap(g=>g.teams.slice(1)).sort(compareTeams);
  return [...leaders, ...rest];
}

function renderStandingsTable(container, teams, showLeaders){
  if(!teams.length){ container.innerHTML = `<div class="state-msg">No live standings yet — add Sleeper divisions with valid league IDs to see combined standings.</div>`; return; }
  const numDivisions = new Set(teams.map(t=>t.divisionId)).size;
  const rows = teams.map((t,idx)=>{
    const isLeader = showLeaders && idx < numDivisions && teams.findIndex(x=>x.divisionId===t.divisionId)===idx;
    return `<tr class="${isLeader?'leader-row':''}">
      <td class="rank-cell">${isLeader?'<span class="crown">&#9819;</span>':''}${idx+1}</td>
      <td><div class="team-cell">${avatarHtml(t,'avatar','avatar-fallback')}<div><div class="team-name">${escapeHtml(t.teamName)} <span class="div-chip">${escapeHtml(t.divisionName||'')}</span></div>${t.ownerName?`<div class="owner-name">${escapeHtml(t.ownerName)}</div>`:''}</div></div></td>
      <td class="num">${t.wins}-${t.losses}${t.ties?('-'+t.ties):''}</td>
      <td class="num">${fmt1(t.ptsFor)}</td>
      <td class="num">${fmt1(t.ptsAgainst)}</td>
    </tr>`;
  }).join('');
  container.innerHTML = `<div class="table-scroll"><table class="standings">
    <thead><tr><th></th><th>Team</th><th class="num">Record</th><th class="num">PF</th><th class="num">PA</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ============================ DIVISION PAGE (Sleeper) ============================ */
async function renderDivisionPage(app, league, divisions, divId){

  if(!division){ app.innerHTML = topbarHtml(`#/league/${league.slug}`) + `<div class="state-msg error">Division not found.</div>`; return; }

  if(division.platform !== 'sleeper' || !division.external_league_id){
    app.innerHTML = topbarHtml(`#/league/${league.slug}`)
      + leagueNavHtml(league, divisions, 'div:'+division.id) + `
      <div class="hero" style="margin:10px 0;"><h1 style="font-size:26px;">${escapeHtml(division.name)}</h1></div>
      <div class="alert info">
        ${division.platform==='espn' ? "ESPN live sync for this division is being finalized — public leagues will pull automatically once enabled; private leagues use the cookies your commissioner provided." : `${platformLabel[division.platform]} doesn't support automatic live sync yet. Ask your commissioner to enter scores manually, or switch this division to Sleeper for full live stats.`}

  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'div:'+division.id)
    + `<div class="state-msg">Loading division…</div>`;
  await ensureSleeperBasics(division);
  const state = await ensureNflState();
  const info = divCache(division.id).info;
  const currentWeek = state.week || 1;
  const totalWeeks = (info.settings && info.settings.playoff_week_start) ? info.settings.playoff_week_start - 1 : 14;
  const teams = teamsForDivision(division);
  const byRoster = {}; teams.forEach(t=>byRoster[t.roster_id]=t);

  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'div:'+division.id) + `
    <div class="hero" style="margin:10px 0 4px;">
      <h1 style="font-size:clamp(24px,4vw,32px);">${escapeHtml(division.name)}</h1>
      <p style="margin-top:4px;">${escapeHtml(info.name)} &middot; ${teams.length} teams &middot; Sleeper live</p>
    </div>
    <div class="section-label">Standings</div>
    <div id="standBody"><div class="state-msg">Loading…</div></div>
    <div class="week-tabs" id="weekTabs"></div>
    <div class="live-bar">
      <div class="live-pill" id="liveStatus"></div>
      <button class="refresh-btn" id="liveRefreshBtn">Refresh now</button>
    </div>
    <div id="matchups"><div class="state-msg">Loading matchups…</div></div>
    <div class="section-label">Rosters</div>
    <div class="roster-cards" id="rosterCards"></div>
    <div class="section-label">Draft Order</div>
    <div id="draftOrder"><div class="state-msg">Loading draft order…</div></div>
  `;

  renderStandingsTable(document.getElementById('standBody'), teams.slice().sort(compareTeams), false);

  tabsEl.innerHTML = tabsHtml;
  tabsEl.querySelectorAll('.week-tab').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      tabsEl.querySelectorAll('.week-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');

    });
  });
  document.getElementById('liveRefreshBtn').addEventListener('click', ()=> tickLive(true));
  await loadDivisionWeek(division, currentWeek, byRoster, state);

async function loadDraftOrder(division, teams){
  const container = document.getElementById('draftOrder');
  try{
    const draftInfo = await ensureDraftInfo(division);
    renderDraftOrder(container, draftInfo, teams);
  }catch(e){
    container.innerHTML = `<div class="state-msg">Couldn't load draft order.</div>`;
  }
}

function renderDraftOrder(container, draftInfo, teams){
  const byRoster = {}; teams.forEach(t=>byRoster[t.roster_id]=t);
  const draft = draftInfo.draft;
  if(!draft || !draft.slot_to_roster_id || !Object.keys(draft.slot_to_roster_id).length){
    container.innerHTML = `<div class="state-msg">Draft order hasn't been set for this league yet.</div>`;
    return;
  }
  const slotToRoster = draft.slot_to_roster_id;
  const numSlots = Object.keys(slotToRoster).length;
  const totalRounds = (draft.settings && draft.settings.rounds) || 15;

  const tradeMap = {};
  (draftInfo.tradedPicks||[]).forEach(tp=>{ tradeMap[`${tp.round}-${tp.roster_id}`] = tp; });

  let html = '';
  for(let r=1; r<=totalRounds; r++){
    html += `<div class="draft-round"><div class="draft-round-head">Round ${r}</div>`;
    for(let s=1; s<=numSlots; s++){
      const origRosterId = slotToRoster[s];
      const trade = tradeMap[`${r}-${origRosterId}`];
      const currentRosterId = trade ? trade.owner_id : origRosterId;
      const currentTeam = byRoster[currentRosterId];
      const origTeam = byRoster[origRosterId];
      const overallPick = (r-1)*numSlots + s;
      html += `<div class="draft-pick-row">
        <div class="dp-num num">${overallPick}</div>
        <div>
          <div class="dp-player">${escapeHtml(currentTeam ? currentTeam.teamName : 'Unassigned')}</div>
          ${trade ? `<div class="dp-meta">Traded &middot; originally ${escapeHtml(origTeam ? origTeam.teamName : 'Unknown')}'s pick</div>` : ''}
        </div>
        <div class="dp-team">Slot ${s}</div>
      </div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

async function loadDivisionWeek(division, week, byRoster, nflState){
  const container = document.getElementById('matchups');
  if(!container) return;
  stopLive();
  container.innerHTML = `<div class="state-msg">Loading week ${week}…</div>`;
  let data;
  try{ data = await ensureSleeperMatchups(division, week); }
  catch(e){ container.innerHTML = `<div class="state-msg error">Couldn't load this week's matchups.</div>`; return; }
  if(!data || !data.length){ container.innerHTML = `<div class="state-msg">No matchup data yet for week ${week}.</div>`; return; }

  buildMatchupCards(container, data, byRoster);

  const season = nflState.season;
  const isCurrentWeek = String(week) === String(nflState.week);

  // Projections and clocks arrive after the scores are already on screen.
  try{
    await Promise.all([
      ensurePlayers(),
      ensureProjections(season, week).catch(()=>null),
      refreshScores(season, week, true).catch(()=>null)
    ]);
    paintLive(container, division, season, week);
  }catch(e){ console.warn('Projection load failed', e); }

  startLive({
    anchor: container,
    pollable: isCurrentWeek,
    idleText: isCurrentWeek ? '' : 'Week ' + week + ' final',
    refresh: async ()=>{
      const [fresh] = await Promise.all([
        ensureSleeperMatchups(division, week, true),
        refreshScores(season, week, true)
      ]);
      if(!document.body.contains(container)) return;
      rebindMatchupEntries(container, fresh);
      paintLive(container, division, season, week);
      // Keep records and points-for in step with the live scoring.
      try{
        await ensureSleeperBasics(division, true);
        const standBody = document.getElementById('standBody');
        if(standBody) renderStandingsTable(standBody, teamsForDivision(division).sort(compareTeams), false);
      }catch(e){ /* standings are secondary — never fail the tick over them */ }
    }
  });
}

/* Cards are built once; every refresh afterwards patches text in place so open
   roster panels and scroll position survive. */
function buildMatchupCards(container, data, byRoster){
  const byMatchup = {};
  data.forEach(e=>{ (byMatchup[e.matchup_id] = byMatchup[e.matchup_id] || []).push(e); });
  const pairs = Object.values(byMatchup);
  container.innerHTML = pairs.map(pair=>matchupCardHtml(pair[0], pair[1]||null, byRoster)).join('');

  const cards = [...container.querySelectorAll('.matchup-card')];
  cards.forEach((card,i)=>{
    card._e1 = pairs[i][0];
    card._e2 = pairs[i][1] || null;
    const row = card.querySelector('.expand-row');
    if(!row) return;
    row.addEventListener('click', ()=>{
      const detail = row.nextElementSibling;
      row.classList.toggle('open');
      detail.classList.toggle('open');
    });
  });
}

function rebindMatchupEntries(container, data){
  const byRosterId = {};
  (data||[]).forEach(e=>{ byRosterId[e.roster_id] = e; });
  container.querySelectorAll('.matchup-card').forEach(card=>{
    if(card._e1 && byRosterId[card._e1.roster_id]) card._e1 = byRosterId[card._e1.roster_id];
    if(card._e2 && byRosterId[card._e2.roster_id]) card._e2 = byRosterId[card._e2.roster_id];
  });
}

function matchupCardHtml(e1, e2, byRoster){
  const t1 = byRoster[e1.roster_id] || { teamName:'Team '+e1.roster_id, wins:0, losses:0 };
  const t2 = e2 ? (byRoster[e2.roster_id] || { teamName:'Team '+e2.roster_id, wins:0, losses:0 }) : null;
  return `<div class="matchup-card">
    <div class="matchup-top">
      <div class="mt-team" data-role="team1">${avatarHtml(t1,'mt-avatar','mt-avatar-fallback')}
        <div class="mt-info"><div class="mt-team-name">${escapeHtml(t1.teamName)}</div><div class="mt-record">${t1.wins}-${t1.losses}</div></div></div>
      <div class="mt-center">
        <div class="mt-side"><div class="mt-score num" data-role="score1">&mdash;</div><div class="mt-proj" data-role="proj1"></div></div>
        <div class="mt-vs">&mdash;</div>
        <div class="mt-side"><div class="mt-score num" data-role="score2">${t2?'&mdash;':'BYE'}</div><div class="mt-proj" data-role="proj2"></div></div>
      </div>
      ${t2?`<div class="mt-team right" data-role="team2">${avatarHtml(t2,'mt-avatar','mt-avatar-fallback')}
        <div class="mt-info"><div class="mt-team-name">${escapeHtml(t2.teamName)}</div><div class="mt-record">${t2.wins}-${t2.losses}</div></div></div>`:'<div></div>'}
    </div>
    ${t2?`<div class="expand-row">Starters, projections &amp; health <span>&#9660;</span></div>
    <div class="roster-detail" data-t1="${escapeHtml(t1.teamName)}" data-t2="${escapeHtml(t2.teamName)}"></div>`:''}
  </div>`;
}

/* ---- painting live numbers into an already-rendered card ---- */

function setText(el, value){
  if(!el) return;
  const next = String(value);
  if(el.textContent === next) return;
  el.textContent = next;
  // Flash only once the element has held a real value before.
  if(el.dataset.seen === '1'){
    el.classList.remove('flash');
    void el.offsetWidth; // restart the animation
    el.classList.add('flash');
  }
  el.dataset.seen = '1';
}

function playerDisplayName(p, pid){
  if(!p) return pid;
  return p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || pid;
}

function paintLive(container, division, season, week){
  const info = divCache(division.id).info || {};
  const scoring = info.scoring_settings;
  let anyLive = false;

  container.querySelectorAll('.matchup-card').forEach(card=>{
    const e1 = card._e1, e2 = card._e2;
    if(!e1) return;
    const l1 = entryLive(e1, scoring, season, week);
    const l2 = e2 ? entryLive(e2, scoring, season, week) : null;
    if(l1.anyPlaying || (l2 && l2.anyPlaying)) anyLive = true;

    setText(card.querySelector('[data-role="score1"]'), fmt1(l1.actual));
    if(l2) setText(card.querySelector('[data-role="score2"]'), fmt1(l2.actual));

    paintProjection(card.querySelector('[data-role="proj1"]'), l1, l2);
    if(l2) paintProjection(card.querySelector('[data-role="proj2"]'), l2, l1);

    // Grey out whoever is currently behind on actual points.
    const started = l1.actual > 0 || (l2 && l2.actual > 0);
    const team1 = card.querySelector('[data-role="team1"]');
    const team2 = card.querySelector('[data-role="team2"]');
    if(team1) team1.classList.toggle('loser', !!(started && l2 && l1.actual < l2.actual));
    if(team2) team2.classList.toggle('loser', !!(started && l2.actual < l1.actual));

    const detail = card.querySelector('.roster-detail');
    if(detail && l2) paintDetail(detail, l1, l2);
  });

  live.anyLive = anyLive;
  updateLiveStatus();
}

function paintProjection(el, self, other){
  if(!el || !self) return;
  setText(el, 'Proj ' + fmt1(self.projected));
  el.classList.toggle('playing', self.anyPlaying);
  el.classList.toggle('winning', !!(other && self.projected > other.projected));
}

function paintDetail(detail, l1, l2){
  if(!sleeperCache.players) return;
  const sig = l1.rows.map(r=>r.pid).join(',') + '|' + l2.rows.map(r=>r.pid).join(',');
  if(detail.dataset.sig !== sig){
    detail.dataset.sig = sig;
    detail.innerHTML = `<div class="roster-grid">
      ${starterColumnHtml(detail.dataset.t1, l1, 'a')}
      ${starterColumnHtml(detail.dataset.t2, l2, 'b')}
    </div>`;
  }
  paintStarterColumn(detail, l1, 'a');
  paintStarterColumn(detail, l2, 'b');
}

function starterColumnHtml(label, le, side){
  const rows = le.rows.map((r,i)=>{
    const p = (sleeperCache.players && sleeperCache.players[r.pid]) || {};
    return `<div class="roster-row" data-slot="${side}${i}">
      <div class="rp-name">
        <span class="rp-pos">${escapeHtml(p.position||'')}</span>
        <span class="rp-player">${escapeHtml(playerDisplayName(p, r.pid))}</span>
        ${injuryTag(p.injury_status)}
        <span class="rp-gamestate" data-role="gs"></span>
      </div>
      <div class="rp-scores">
        <span class="rp-proj-val" data-role="proj"></span>
        <span class="rp-pts num" data-role="pts"></span>
      </div>
    </div>`;
  }).join('');
  return `<div>
    <div class="roster-col-head">${escapeHtml(label)}</div>
    <div class="roster-col-sub"><span>Proj</span><span>Pts</span></div>
    ${rows || '<div class="state-msg">No starters set</div>'}
  </div>`;
}

function paintStarterColumn(detail, le, side){
  le.rows.forEach((r,i)=>{
    const row = detail.querySelector(`[data-slot="${side}${i}"]`);
    if(!row) return;
    setText(row.querySelector('[data-role="pts"]'), fmt1(r.actual));
    const proj = row.querySelector('[data-role="proj"]');
    setText(proj, r.hasProjection ? fmt1(r.projected) : '—');
    if(proj) proj.classList.toggle('playing', r.playing);
    const gs = row.querySelector('[data-role="gs"]');
    setText(gs, gameStateLabel(r.game));
    if(gs) gs.classList.toggle('playing', r.playing);
  });
}

function rosterCardHtml(t, startSlots){
  const starterSet = new Set(t.starters), reserveSet = new Set(t.reserve);
  const starterRows = t.starters.map((pid,i)=>({pid, slot:startSlots[i]||''}));
  const benchRows = t.players.filter(pid=>!starterSet.has(pid)&&!reserveSet.has(pid)).map(pid=>({pid, slot:(sleeperCache.players&&sleeperCache.players[pid]&&sleeperCache.players[pid].position)||'BN'}));
  const irRows = t.reserve.map(pid=>({pid, slot:'IR'}));
  function row(r){
    const p = (sleeperCache.players && sleeperCache.players[r.pid]) || {};
    const name = p.full_name || r.pid;
    return `<div class="roster-row"><div class="rp-name"><span class="rp-pos">${escapeHtml(r.slot)}</span><span class="rp-player">${escapeHtml(name)}</span>${injuryTag(p.injury_status)}</div></div>`;
  }
  function section(label, rows){ return rows.length ? `<div class="roster-section-head">${label}</div>${rows.map(row).join('')}` : ''; }
  return `<div class="roster-card">
    <div class="roster-card-head">${avatarHtml(t,'avatar','avatar-fallback')}<div><div class="roster-card-title">${escapeHtml(t.teamName)}</div><div class="roster-card-sub">${t.wins}-${t.losses} &middot; ${escapeHtml(t.ownerName)}</div></div></div>
    ${section('STARTERS', starterRows)}${section('BENCH', benchRows)}${section('IR', irRows)}
  </div>`;
}

/* ============================ SUPER LEAGUE BRACKET ============================ */
function reseedPair(list){ const pairs=[]; const n=list.length; for(let i=0;i<Math.floor(n/2);i++) pairs.push([list[i], list[n-1-i]]); return pairs; }
function nextPow2(n){ let p=2; while(p<n) p*=2; return p; }

async function computeSuperBracket(league, divisions){
  await loadAllSleeperTeams(divisions);
  const groups = divisions.map(d=>{
    const c = divCache(d.id);
    if(!c.info) return [];
    return teamsForDivision(d).sort(compareTeams);
  }).filter(g=>g.length);
  if(!groups.length) return null;

  const leaders = groups.map(g=>g[0]).sort(compareTeams);
  const rest = groups.flatMap(g=>g.slice(1)).sort(compareTeams);
  const advanceCount = Math.min(league.playoff_advance_count || 8, leaders.length + rest.length);
  const ordered = [...leaders, ...rest].slice(0, advanceCount);
  const bracketSize = nextPow2(ordered.length);
  const seeds = ordered.map((t,i)=>({...t, seed:i+1}));
  const byes = [];
  while(seeds.length < bracketSize) seeds.push(null); // padding, handled as byes below

  const realSeeds = seeds.filter(Boolean);
  let pairsForRound = reseedPair(realSeeds);
  const totalRounds = Math.log2(bracketSize);
  const roundLabels = totalRounds<=1?['Championship']:totalRounds===2?['Semifinals','Championship']:totalRounds===3?['Quarterfinals','Semifinals','Championship']:['Round 1','Round 2','Quarterfinals','Semifinals','Championship'].slice(-totalRounds);

  const rounds = [];
  for(let r=0;r<totalRounds;r++){
    const results = pairsForRound.map(([a,b])=>{
      if(!b) return {a, b:null, winner:a, bye:true};
      const winner = compareTeams(a,b)<=0 ? a : b;
      return {a,b,winner,bye:false};
    });
    rounds.push({label:roundLabels[r], results});
    let advancing = results.map(res=>res.winner).sort((x,y)=>x.seed-y.seed);
    pairsForRound = reseedPair(advancing);
  }
  return { rounds, champion: rounds[rounds.length-1].results[0].winner };
}

async function renderSuperBracketPage(app, league, divisions){
  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'bracket') + `
    <div class="hero" style="margin:10px 0 4px;"><h1 style="font-size:28px;">&#9819; Super League Playoffs</h1></div>
    <div class="alert info">Top ${league.playoff_advance_count} teams across all ${divisions.length} divisions. Each division's #1 seed locks into the top seeds; the rest are ranked by record. Every round, lowest surviving seed plays highest surviving seed. This is a projection — divisions run as separate leagues, so cross-division games aren't live-tracked.</div>
    <div id="bracketBody"><div class="state-msg">Building bracket…</div></div>
  `;
  const result = await computeSuperBracket(league, divisions);
  const body = document.getElementById('bracketBody');
  if(!result){ body.innerHTML = `<div class="state-msg">Add Sleeper divisions with valid league IDs to build a bracket.</div>`; return; }
  body.innerHTML = `<div class="bracket-scroll">${result.rounds.map(round=>{
    const pairs = round.results.map(res=>{
      if(res.bye) return `<div class="bracket-pair"><div class="bye-slot">Seed ${res.a.seed} &middot; ${escapeHtml(res.a.teamName)} — Bye</div></div>`;
      const aWin = res.winner.roster_id===res.a.roster_id && res.winner.divisionId===res.a.divisionId;
      return `<div class="bracket-pair">
        <div class="bracket-slot ${aWin?'winner':'loser'}"><span class="bseed">${res.a.seed}</span><span class="bname">${escapeHtml(res.a.teamName)}</span></div>
        <div class="bracket-slot ${!aWin?'winner':'loser'}"><span class="bseed">${res.b.seed}</span><span class="bname">${escapeHtml(res.b.teamName)}</span></div>
      </div>`;
    }).join('');
    return `<div class="bracket-col"><div class="bracket-col-head">${round.label}</div>${pairs}</div>`;
  }).join('')}</div>
  <div class="champion-box"><div class="champion-label">Projected Champion</div><div class="champion-name">&#127942; ${escapeHtml(result.champion.teamName)}</div></div>`;
}

    <div class="form-row2">
      <div class="form-group"><label class="form-label">Playoff Length (weeks)</label><input class="form-input" id="m_playoffweeks" type="number" min="1" max="6" value="${league.playoff_length_weeks}"></div>
      <div class="form-group"><label class="form-label">Teams Advancing to Playoffs</label><input class="form-input" id="m_advance" type="number" min="2" value="${league.playoff_advance_count}"></div>
    </div>
    <div class="form-group">
      <label class="form-label" style="display:flex;align-items:center;gap:8px;font-size:12.5px;">
        <input type="checkbox" id="m_public" style="width:auto;" ${league.is_public?'checked':''}> Publicly searchable
      </label>
    </div>
    <button class="primary-btn" id="saveSettingsBtn">Save Settings</button>
    <button class="secondary-btn" id="finalizeBtn" style="margin-left:8px;">${league.finalized?'Marked as Finalized':'Mark League as Finalized'}</button>

    <div class="section-label">Divisions</div>
    <div id="manageDivisions">${divisions.map(d=>`<div class="division-fields">
      <div class="division-fields-head">${escapeHtml(d.name)} &middot; ${platformLabel[d.platform]}</div>
      <div class="form-hint">League ID: ${escapeHtml(d.external_league_id||'—')}</div>
    </div>`).join('')}</div>

    <div class="section-label">Members</div>
    <div id="membersList"><div class="state-msg">Loading members…</div></div>
  `;

  sbFetch(`/rest/v1/league_members?league_id=eq.${league.id}&select=id,joined_at`, { headers:{Authorization:'Bearer '+session.access_token} })
    .then(rows=>{
      const el = document.getElementById('membersList');
      if(!rows || !rows.length){ el.innerHTML = `<div class="state-msg">No members have joined via invite yet.</div>`; return; }
      el.innerHTML = `<div class="form-hint">${rows.length} member${rows.length===1?'':'s'} joined via invite code.</div>`;
    })
    .catch(()=>{ document.getElementById('membersList').innerHTML = `<div class="state-msg">Couldn't load members.</div>`; });

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const alertEl = document.getElementById('manageAlert');
    try{
      await sbFetch(`/rest/v1/leagues?id=eq.${league.id}`, { method:'PATCH', headers:{Authorization:'Bearer '+session.access_token, Prefer:'return=minimal'}, body: JSON.stringify({
        playoff_length_weeks: parseInt(document.getElementById('m_playoffweeks').value),
        playoff_advance_count: parseInt(document.getElementById('m_advance').value),
        is_public: document.getElementById('m_public').checked
      })});
      alertEl.innerHTML = `<div class="alert success">Settings saved.</div>`;
    }catch(e){ alertEl.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`; }
  });
  document.getElementById('finalizeBtn').addEventListener('click', async ()=>{
    try{
      await sbFetch(`/rest/v1/leagues?id=eq.${league.id}`, { method:'PATCH', headers:{Authorization:'Bearer '+session.access_token, Prefer:'return=minimal'}, body: JSON.stringify({finalized:true}) });
      location.reload();
    }catch(e){ document.getElementById('manageAlert').innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`; }
  });
}

/* Patch router to handle /superbracket sub-route */
const _origRenderLeagueRoute = renderLeagueRoute;
renderLeagueRoute = async function(app, r){
  if(r.sub==='superbracket'){
    app.innerHTML = topbarHtml('#/') + `<div class="state-msg">Loading…</div>`;
    const league = await getLeagueBySlug(r.slug);
    if(!league){ app.innerHTML = topbarHtml('#/') + `<div class="state-msg error">League not found.</div>`; return; }
    const divisions = await getDivisions(league.id);
    return renderSuperBracketPage(app, league, divisions);
  }
  return _origRenderLeagueRoute(app, r);
};
</script>
