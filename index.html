      <p>${escapeHtml(leagueSport(league).label)} &middot; ${divisions.length} divisions &middot; Top ${league.playoff_advance_count} make the playoffs &middot; ${league.playoff_length_weeks}-week playoff bracket</p>
    </div>
    <div class="tiles-grid" id="divTiles">
      ${divisions.map(d=>`<a class="tile" href="#/league/${league.slug}/division/${d.id}">
        <div class="tile-bar"></div>
        <div><div class="tile-label">${escapeHtml(d.name)}</div><div class="platform-chip">${platformLabel[d.platform]||d.platform}</div></div>
      </a>`).join('')}
      <a class="tile super" href="#/league/${league.slug}/superbracket">
        <div class="tile-bar"></div>
        <div><div class="tile-label" style="color:var(--gold);">COMBINED</div><div class="tile-title">&#9819; Super League</div></div>
      </a>
    </div>
    <div class="section-label">Super League Standings</div>
    <div class="live-bar">
      <div class="live-pill" id="liveStatus"></div>
      <button class="refresh-btn" id="liveRefreshBtn">Refresh now</button>
    </div>
    <div id="superStandings"><div class="state-msg">Loading combined standings…</div></div>
    <div class="footnote">Standings combine every division. Each division's #1 seed is guaranteed a top spot; everyone else is ranked by record. Records and points update automatically as games finish — open a division for live scores and projections.</div>
  `;

  const paintStandings = ()=>{
    const el = document.getElementById('superStandings');
    if(el) renderStandingsTable(el, combineStandings(divisions), true);
  };

  await loadAllSleeperTeams(divisions);
  paintStandings();

  const hasSleeper = divisions.some(d=>(d.platform==='sleeper' && d.external_league_id) || d.platform==='hosted');
  document.getElementById('liveRefreshBtn').addEventListener('click', ()=> tickLive(true));
  startLive({
    anchor: document.getElementById('superStandings'),
    pollable: hasSleeper,
    idleText: 'No live divisions',
    refresh: async ()=>{
      await loadAllSleeperTeams(divisions, true);
      paintStandings();
      // Reflect whether anything is actually being played right now.
      try{
        const state = await ensureNflState();
        const byTeam = await refreshScores(state.season, state.week, true);
        live.anyLive = Object.values(byTeam).some(g=> (g.metadata||{}).is_in_progress);
      }catch(e){ /* pill just stays in its idle style */ }
    }
  });
}

async function loadAllSleeperTeams(divisions, force){
  const liveDivs = divisions.filter(d=>(d.platform==='sleeper' && d.external_league_id) || d.platform==='hosted');
  await Promise.all(liveDivs.map(async d=>{
    try{
      // Hosted divisions are shaped into the same cache so standings and the bracket treat them alike.
      if(d.platform==='hosted') await ensureHostedBasics(d, force);
      else await ensureSleeperBasics(d, force);
    }catch(e){ /* ignore individual failures */ }
  }));
}

function combineStandings(divisions){
  const groups = divisions.map(d=>{
    const c = divCache(d.id);
    if(!c.info || !c.rosters) return { division:d, teams:[] };
    return { division:d, teams: teamsForDivision(d).sort(compareTeams) };
  }).filter(g=>g.teams.length);
  if(!groups.length) return [];
  const leaders = groups.map(g=>g.teams[0]).sort(compareTeams);
  const rest = groups.flatMap(g=>g.teams.slice(1)).sort(compareTeams);
  return [...leaders, ...rest];
}

function renderStandingsTable(container, teams, showLeaders){
  if(!teams.length){ container.innerHTML = `<div class="state-msg">No live standings yet — add Sleeper divisions with valid league IDs to see combined standings.</div>`; return; }
  const numDivisions = new Set(teams.map(t=>t.divisionId)).size;
  const rows = teams.map((t,idx)=>{
    const isLeader = showLeaders && idx < numDivisions && teams.findIndex(x=>x.divisionId===t.divisionId)===idx;
    return `<tr class="${isLeader?'leader-row':''}">
      <td class="rank-cell">${isLeader?'<span class="crown">&#9819;</span>':''}${idx+1}</td>
      <td><div class="team-cell">${avatarHtml(t,'avatar','avatar-fallback')}<div><div class="team-name">${escapeHtml(t.teamName)} <span class="div-chip">${escapeHtml(t.divisionName||'')}</span></div>${t.ownerName?`<div class="owner-name">${escapeHtml(t.ownerName)}</div>`:''}</div></div></td>
      <td class="num">${t.wins}-${t.losses}${t.ties?('-'+t.ties):''}</td>
      <td class="num">${fmt1(t.ptsFor)}</td>
      <td class="num">${fmt1(t.ptsAgainst)}</td>
    </tr>`;
  }).join('');
  container.innerHTML = `<div class="table-scroll"><table class="standings">
    <thead><tr><th></th><th>Team</th><th class="num">Record</th><th class="num">PF</th><th class="num">PA</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ============================ DIVISION PAGE (Sleeper) ============================ */
async function renderDivisionPage(app, league, divisions, divId, tab){
  const division = divisions.find(d=>d.id===divId);
  if(!division){ app.innerHTML = topbarHtml(`#/league/${league.slug}`) + `<div class="state-msg error">Division not found.</div>`; return; }
  if(division.platform === 'hosted') return renderHostedDivision(app, league, divisions, division, tab);

  const sport = leagueSport(league);
  if(division.platform !== 'sleeper' || !division.external_league_id || !sport.live){
    let msg;
    if(!sport.live){
      msg = `This is a ${sport.label.toLowerCase()} league. Live scoring, projections and injury data are only available for football (NFL) right now, so this division needs scores entered manually.`;
    } else if(division.platform==='espn'){
      msg = "ESPN live sync for this division is being finalized — public leagues will pull automatically once enabled; private leagues use the cookies your commissioner provided.";
    } else {
      msg = `${platformLabel[division.platform]} doesn't support automatic live sync yet. Ask your commissioner to enter scores manually, or switch this division to Sleeper for full live stats.`;
    }
    app.innerHTML = topbarHtml(`#/league/${league.slug}`)
      + leagueNavHtml(league, divisions, 'div:'+division.id) + `
      <div class="hero" style="margin:10px 0;"><h1 style="font-size:26px;">${escapeHtml(division.name)}</h1></div>
      <div class="alert info">${msg}</div>`;
    return;
  }

  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'div:'+division.id)
    + `<div class="state-msg">Loading division…</div>`;
  await ensureSleeperBasics(division);
  const state = await ensureNflState();
  const info = divCache(division.id).info;
  const currentWeek = state.week || 1;
  const totalWeeks = (info.settings && info.settings.playoff_week_start) ? info.settings.playoff_week_start - 1 : 14;
  const teams = teamsForDivision(division);
  const byRoster = {}; teams.forEach(t=>byRoster[t.roster_id]=t);

  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'div:'+division.id) + `
    <div class="hero" style="margin:10px 0 4px;">
      <h1 style="font-size:clamp(24px,4vw,32px);">${escapeHtml(division.name)}</h1>
      <p style="margin-top:4px;">${escapeHtml(info.name)} &middot; ${teams.length} teams &middot; Sleeper live</p>
    </div>
    <div class="section-label">Standings</div>
    <div id="standBody"><div class="state-msg">Loading…</div></div>
    <div class="week-tabs" id="weekTabs"></div>
    <div class="live-bar">
      <div class="live-pill" id="liveStatus"></div>
      <button class="refresh-btn" id="liveRefreshBtn">Refresh now</button>
    </div>
    <div id="matchups"><div class="state-msg">Loading matchups…</div></div>

    <div class="section-label">Injury Report</div>
    <div id="injuryReport"><div class="state-msg">Loading injury report…</div></div>

    <div class="section-label">Free Agents</div>
    <div class="fa-controls" id="faControls"></div>
    <div id="freeAgents"><div class="state-msg">Loading free agents…</div></div>

    <div class="section-label">Rosters</div>
    <div class="roster-cards" id="rosterCards"></div>
    <div class="section-label">Draft Order</div>
    <div id="draftOrder"><div class="state-msg">Loading draft order…</div></div>
  `;

  renderStandingsTable(document.getElementById('standBody'), teams.slice().sort(compareTeams), false);

  const tabsEl = document.getElementById('weekTabs');
  let tabsHtml = '';
  for(let w=1; w<=Math.max(totalWeeks,currentWeek); w++) tabsHtml += `<button class="week-tab ${w===currentWeek?'active':''}" data-week="${w}">Wk ${w}</button>`;
  tabsEl.innerHTML = tabsHtml;
  tabsEl.querySelectorAll('.week-tab').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      tabsEl.querySelectorAll('.week-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      await loadDivisionWeek(division, parseInt(btn.dataset.week), byRoster, state);
    });
  });
  document.getElementById('liveRefreshBtn').addEventListener('click', ()=> tickLive(true));
  await loadDivisionWeek(division, currentWeek, byRoster, state);

  await ensurePlayers(leagueSport(league).id);
  const startSlots = (info.roster_positions||[]).filter(p=>p!=='BN'&&p!=='IR'&&p!=='TAXI');
  document.getElementById('rosterCards').innerHTML = teams.map(t=>rosterCardHtml(t, startSlots)).join('');

  renderInjuryReport(document.getElementById('injuryReport'), teams);
  renderFreeAgents(division, teams, state);

  loadDraftOrder(division, teams);
}

/* ============================ INJURY REPORT ============================ */
const INJURY_ORDER = { 'out':0, 'ir':1, 'injured reserve':1, 'pup':2, 'doubtful':3, 'questionable':4, 'sus':5, 'cov':6 };
function injurySeverity(status){
  const k = String(status||'').toLowerCase();
  return INJURY_ORDER[k] != null ? INJURY_ORDER[k] : 7;
}

function renderInjuryReport(container, teams){
  if(!container) return;
  if(!sleeperCache.players){ container.innerHTML = `<div class="state-msg">Player data unavailable.</div>`; return; }

  const rows = [];
  teams.forEach(t=>{
    const starters = new Set(t.starters||[]);
    (t.players||[]).forEach(pid=>{
      const p = sleeperCache.players[pid];
      if(!p || !p.injury_status) return;
      rows.push({
        pid, team:t, player:p,
        starter: starters.has(pid),
        severity: injurySeverity(p.injury_status)
      });
    });
  });

  if(!rows.length){
    container.innerHTML = `<div class="state-msg">No injuries reported across this division right now.</div>`;
    return;
  }

  // Most serious first, and within that starters before bench.
  rows.sort((a,b)=> a.severity-b.severity || (b.starter-a.starter) || a.team.teamName.localeCompare(b.team.teamName));

  const counts = {};
  rows.forEach(r=>{ const k=r.player.injury_status; counts[k]=(counts[k]||0)+1; });
  const summary = Object.keys(counts).sort((a,b)=>injurySeverity(a)-injurySeverity(b))
    .map(k=>`<span class="inj-chip">${escapeHtml(k)} <b>${counts[k]}</b></span>`).join('');

  container.innerHTML = `
    <div class="inj-summary">${summary}<span class="inj-total">${rows.length} affected player${rows.length===1?'':'s'}</span></div>
    <div class="table-scroll"><table class="standings inj-table">
      <thead><tr><th>Player</th><th>Status</th><th>Detail</th><th>Fantasy Team</th></tr></thead>
      <tbody>${rows.map(r=>{
        const p = r.player;
        const detail = p.injury_body_part || (p.status && p.status!=='Active' ? p.status : '') || '—';
        return `<tr>
          <td><div class="inj-player">
            <span class="rp-pos">${escapeHtml(p.position||'')}</span>
            <span class="inj-name">${escapeHtml(playerDisplayName(p, r.pid))}</span>
            ${r.starter?'<span class="inj-starter">Starter</span>':''}
          </div><div class="inj-nfl">${escapeHtml(p.team||'FA')}</div></td>
          <td>${injuryTag(p.injury_status)||escapeHtml(p.injury_status)}</td>
          <td class="inj-detail">${escapeHtml(detail)}</td>
          <td class="inj-team">${escapeHtml(r.team.teamName)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

/* ============================ FREE AGENTS ============================
   Anyone on an active roster in this Sleeper league is taken; everyone else
   with a projection for the current week is available. Ranked by projected
   points under this league's own scoring settings.                        */
async function renderFreeAgents(division, teams, state){
  const container = document.getElementById('freeAgents');
  const controls = document.getElementById('faControls');
  if(!container) return;

  const info = divCache(division.id).info || {};
  const scoring = info.scoring_settings;
  const season = state.season, week = state.week;

  let projTable;
  try{
    projTable = await ensureProjections(season, week);
  }catch(e){
    container.innerHTML = `<div class="state-msg">Couldn't load projections, so free agents can't be ranked right now.</div>`;
    return;
  }
  if(!sleeperCache.players){ container.innerHTML = `<div class="state-msg">Player data unavailable.</div>`; return; }

  const taken = new Set();
  teams.forEach(t=>(t.players||[]).forEach(pid=>taken.add(pid)));

  const available = [];
  for(const pid in projTable){
    if(taken.has(pid)) continue;
    const p = sleeperCache.players[pid];
    if(!p) continue;
    if(!p.team) continue;                                  // not on an NFL roster
    if(!PROJ_POSITIONS.includes(p.position)) continue;
    const pts = projectedPoints(projTable[pid], scoring);
    if(pts <= 0) continue;
    available.push({ pid, player:p, proj:pts });
  }
  available.sort((a,b)=> b.proj - a.proj);

  if(!available.length){
    container.innerHTML = `<div class="state-msg">No free agents with a projection this week.</div>`;
    return;
  }

  const positions = ['ALL', ...PROJ_POSITIONS.filter(pos=>available.some(a=>a.player.position===pos))];
  controls.innerHTML = positions.map((pos,i)=>
    `<button class="fa-tab ${i===0?'active':''}" data-pos="${pos}">${pos}</button>`).join('')
    + `<span class="fa-note">Week ${week} projections &middot; ${available.length} available</span>`;

  const LIMIT = 15;
  function paint(pos){
    const list = (pos==='ALL' ? available : available.filter(a=>a.player.position===pos)).slice(0, LIMIT);
    container.innerHTML = `<div class="table-scroll"><table class="standings fa-table">
      <thead><tr><th class="rank-cell"></th><th>Player</th><th>Team</th><th class="num">Proj</th><th>Status</th></tr></thead>
      <tbody>${list.map((a,i)=>`<tr>
        <td class="rank-cell">${i+1}</td>
        <td><div class="inj-player"><span class="rp-pos">${escapeHtml(a.player.position||'')}</span>
          <span class="inj-name">${escapeHtml(playerDisplayName(a.player, a.pid))}</span></div></td>
        <td class="fa-nfl">${escapeHtml(a.player.team||'')}</td>
        <td class="num fa-proj">${fmt1(a.proj)}</td>
        <td>${injuryTag(a.player.injury_status)||'<span class="fa-healthy">&mdash;</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }
  controls.querySelectorAll('.fa-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      controls.querySelectorAll('.fa-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      paint(btn.dataset.pos);
    });
  });
  paint('ALL');
}

async function loadDraftOrder(division, teams){
  const container = document.getElementById('draftOrder');
  try{
    const draftInfo = await ensureDraftInfo(division);
    renderDraftOrder(container, draftInfo, teams);
  }catch(e){
    container.innerHTML = `<div class="state-msg">Couldn't load draft order.</div>`;
  }
}

function renderDraftOrder(container, draftInfo, teams){
  const byRoster = {}; teams.forEach(t=>byRoster[t.roster_id]=t);
  const draft = draftInfo.draft;
  if(!draft || !draft.slot_to_roster_id || !Object.keys(draft.slot_to_roster_id).length){
    container.innerHTML = `<div class="state-msg">Draft order hasn't been set for this league yet.</div>`;
    return;
  }
  const slotToRoster = draft.slot_to_roster_id;
  const numSlots = Object.keys(slotToRoster).length;
  const totalRounds = (draft.settings && draft.settings.rounds) || 15;

  const tradeMap = {};
  (draftInfo.tradedPicks||[]).forEach(tp=>{ tradeMap[`${tp.round}-${tp.roster_id}`] = tp; });

  let html = '';
  for(let r=1; r<=totalRounds; r++){
    html += `<div class="draft-round"><div class="draft-round-head">Round ${r}</div>`;
    for(let s=1; s<=numSlots; s++){
      const origRosterId = slotToRoster[s];
      const trade = tradeMap[`${r}-${origRosterId}`];
      const currentRosterId = trade ? trade.owner_id : origRosterId;
      const currentTeam = byRoster[currentRosterId];
      const origTeam = byRoster[origRosterId];
      const overallPick = (r-1)*numSlots + s;
      html += `<div class="draft-pick-row">
        <div class="dp-num num">${overallPick}</div>
        <div>
          <div class="dp-player">${escapeHtml(currentTeam ? currentTeam.teamName : 'Unassigned')}</div>
          ${trade ? `<div class="dp-meta">Traded &middot; originally ${escapeHtml(origTeam ? origTeam.teamName : 'Unknown')}'s pick</div>` : ''}
        </div>
        <div class="dp-team">Slot ${s}</div>
      </div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

async function loadDivisionWeek(division, week, byRoster, nflState){
  const container = document.getElementById('matchups');
  if(!container) return;
  stopLive();
  container.innerHTML = `<div class="state-msg">Loading week ${week}…</div>`;
  let data;
  try{ data = await ensureSleeperMatchups(division, week); }
  catch(e){ container.innerHTML = `<div class="state-msg error">Couldn't load this week's matchups.</div>`; return; }
  if(!data || !data.length){ container.innerHTML = `<div class="state-msg">No matchup data yet for week ${week}.</div>`; return; }

  buildMatchupCards(container, data, byRoster);

  const season = nflState.season;
  const isCurrentWeek = String(week) === String(nflState.week);

  // Projections and clocks arrive after the scores are already on screen.
  try{
    await Promise.all([
      ensurePlayers(),
      ensureProjections(season, week).catch(()=>null),
      refreshScores(season, week, true).catch(()=>null)
    ]);
    paintLive(container, division, season, week);
  }catch(e){ console.warn('Projection load failed', e); }

  startLive({
    anchor: container,
    pollable: isCurrentWeek,
    idleText: isCurrentWeek ? '' : 'Week ' + week + ' final',
    refresh: async ()=>{
      const [fresh] = await Promise.all([
        ensureSleeperMatchups(division, week, true),
        refreshScores(season, week, true)
      ]);
      if(!document.body.contains(container)) return;
      rebindMatchupEntries(container, fresh);
      paintLive(container, division, season, week);
      // Keep records and points-for in step with the live scoring.
      try{
        await ensureSleeperBasics(division, true);
        const standBody = document.getElementById('standBody');
        if(standBody) renderStandingsTable(standBody, teamsForDivision(division).sort(compareTeams), false);
      }catch(e){ /* standings are secondary — never fail the tick over them */ }
    }
  });
}

/* Cards are built once; every refresh afterwards patches text in place so open
   roster panels and scroll position survive. */
function buildMatchupCards(container, data, byRoster){
  const byMatchup = {};
  data.forEach(e=>{ (byMatchup[e.matchup_id] = byMatchup[e.matchup_id] || []).push(e); });
  const pairs = Object.values(byMatchup);
  container.innerHTML = pairs.map(pair=>matchupCardHtml(pair[0], pair[1]||null, byRoster)).join('');

  const cards = [...container.querySelectorAll('.matchup-card')];
  cards.forEach((card,i)=>{
    card._e1 = pairs[i][0];
    card._e2 = pairs[i][1] || null;
    const row = card.querySelector('.expand-row');
    if(!row) return;
    row.addEventListener('click', ()=>{
      const detail = row.nextElementSibling;
      row.classList.toggle('open');
      detail.classList.toggle('open');
    });
  });
}

function rebindMatchupEntries(container, data){
  const byRosterId = {};
  (data||[]).forEach(e=>{ byRosterId[e.roster_id] = e; });
  container.querySelectorAll('.matchup-card').forEach(card=>{
    if(card._e1 && byRosterId[card._e1.roster_id]) card._e1 = byRosterId[card._e1.roster_id];
    if(card._e2 && byRosterId[card._e2.roster_id]) card._e2 = byRosterId[card._e2.roster_id];
  });
}

function matchupCardHtml(e1, e2, byRoster){
  const t1 = byRoster[e1.roster_id] || { teamName:'Team '+e1.roster_id, wins:0, losses:0 };
  const t2 = e2 ? (byRoster[e2.roster_id] || { teamName:'Team '+e2.roster_id, wins:0, losses:0 }) : null;
  return `<div class="matchup-card">
    <div class="matchup-top">
      <div class="mt-team" data-role="team1">${avatarHtml(t1,'mt-avatar','mt-avatar-fallback')}
        <div class="mt-info"><div class="mt-team-name">${escapeHtml(t1.teamName)}</div><div class="mt-record">${t1.wins}-${t1.losses}</div></div></div>
      <div class="mt-center">
        <div class="mt-side"><div class="mt-score num" data-role="score1">&mdash;</div><div class="mt-proj" data-role="proj1"></div></div>
        <div class="mt-vs">&mdash;</div>
        <div class="mt-side"><div class="mt-score num" data-role="score2">${t2?'&mdash;':'BYE'}</div><div class="mt-proj" data-role="proj2"></div></div>
      </div>
      ${t2?`<div class="mt-team right" data-role="team2">${avatarHtml(t2,'mt-avatar','mt-avatar-fallback')}
        <div class="mt-info"><div class="mt-team-name">${escapeHtml(t2.teamName)}</div><div class="mt-record">${t2.wins}-${t2.losses}</div></div></div>`:'<div></div>'}
    </div>
    ${t2?`<div class="winbar-wrap" data-role="winbar">
      <div class="winbar-head">
        <span class="winbar-pct" data-role="wp1">—</span>
        <span class="winbar-label">Win probability</span>
        <span class="winbar-pct" data-role="wp2">—</span>
      </div>
      <div class="winbar"><div class="winbar-fill" data-role="wpfill"></div></div>
    </div>
    <div class="expand-row">Starters, projections &amp; health <span>&#9660;</span></div>
    <div class="roster-detail" data-t1="${escapeHtml(t1.teamName)}" data-t2="${escapeHtml(t2.teamName)}"></div>`:''}
  </div>`;
}

/* ---- painting live numbers into an already-rendered card ---- */

function setText(el, value){
  if(!el) return;
  const next = String(value);
  if(el.textContent === next) return;
  el.textContent = next;
  // Flash only once the element has held a real value before.
  if(el.dataset.seen === '1'){
    el.classList.remove('flash');
    void el.offsetWidth; // restart the animation
    el.classList.add('flash');
  }
  el.dataset.seen = '1';
}

function playerDisplayName(p, pid){
  if(!p) return pid;
  return p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || pid;
}

function paintLive(container, division, season, week){
  const info = divCache(division.id).info || {};
  const scoring = info.scoring_settings;
  let anyLive = false;

  container.querySelectorAll('.matchup-card').forEach(card=>{
    const e1 = card._e1, e2 = card._e2;
    if(!e1) return;
    const l1 = entryLive(e1, scoring, season, week);
    const l2 = e2 ? entryLive(e2, scoring, season, week) : null;
    if(l1.anyPlaying || (l2 && l2.anyPlaying)) anyLive = true;

    setText(card.querySelector('[data-role="score1"]'), fmt1(l1.actual));
    if(l2) setText(card.querySelector('[data-role="score2"]'), fmt1(l2.actual));

    paintProjection(card.querySelector('[data-role="proj1"]'), l1, l2);
    if(l2) paintProjection(card.querySelector('[data-role="proj2"]'), l2, l1);

    // Grey out whoever is currently behind on actual points.
    const started = l1.actual > 0 || (l2 && l2.actual > 0);
    const team1 = card.querySelector('[data-role="team1"]');
    const team2 = card.querySelector('[data-role="team2"]');
    if(team1) team1.classList.toggle('loser', !!(started && l2 && l1.actual < l2.actual));
    if(team2) team2.classList.toggle('loser', !!(started && l2.actual < l1.actual));

    if(l2) paintWinBar(card, l1, l2);

    const detail = card.querySelector('.roster-detail');
    if(detail && l2) paintDetail(detail, l1, l2);
  });

  live.anyLive = anyLive;
  updateLiveStatus();
}

function paintWinBar(card, l1, l2){
  const p = winProbability(l1, l2);
  if(p == null) return;
  setText(card.querySelector('[data-role="wp1"]'), formatWinPct(p));
  setText(card.querySelector('[data-role="wp2"]'), formatWinPct(1-p));
  const fill = card.querySelector('[data-role="wpfill"]');
  if(fill) fill.style.width = (p*100).toFixed(1) + '%';
  const wrap = card.querySelector('[data-role="winbar"]');
  // Once nothing is left to play the number stops being a forecast.
  if(wrap) wrap.classList.toggle('settled', teamSigma(l1) + teamSigma(l2) < 0.5);
}

function paintProjection(el, self, other){
  if(!el || !self) return;
  setText(el, 'Proj ' + fmt1(self.projected));
  el.classList.toggle('playing', self.anyPlaying);
  el.classList.toggle('winning', !!(other && self.projected > other.projected));
}

function paintDetail(detail, l1, l2){
  if(!sleeperCache.players) return;
  const sig = l1.rows.map(r=>r.pid).join(',') + '|' + l2.rows.map(r=>r.pid).join(',');
  if(detail.dataset.sig !== sig){
    detail.dataset.sig = sig;
    detail.innerHTML = `<div class="roster-grid">
      ${starterColumnHtml(detail.dataset.t1, l1, 'a')}
      ${starterColumnHtml(detail.dataset.t2, l2, 'b')}
    </div>`;
  }
  paintStarterColumn(detail, l1, 'a');
  paintStarterColumn(detail, l2, 'b');
}

function starterColumnHtml(label, le, side){
  const rows = le.rows.map((r,i)=>{
    const p = (sleeperCache.players && sleeperCache.players[r.pid]) || {};
    return `<div class="roster-row" data-slot="${side}${i}">
      <div class="rp-name">
        <span class="rp-pos">${escapeHtml(p.position||'')}</span>
        <span class="rp-player">${escapeHtml(playerDisplayName(p, r.pid))}</span>
        ${injuryTag(p.injury_status)}
        <span class="rp-gamestate" data-role="gs"></span>
      </div>
      <div class="rp-scores">
        <span class="rp-proj-val" data-role="proj"></span>
        <span class="rp-pts num" data-role="pts"></span>
      </div>
    </div>`;
  }).join('');
  return `<div>
    <div class="roster-col-head">${escapeHtml(label)}</div>
    <div class="roster-col-sub"><span>Proj</span><span>Pts</span></div>
    ${rows || '<div class="state-msg">No starters set</div>'}
  </div>`;
}

function paintStarterColumn(detail, le, side){
  le.rows.forEach((r,i)=>{
    const row = detail.querySelector(`[data-slot="${side}${i}"]`);
    if(!row) return;
    setText(row.querySelector('[data-role="pts"]'), fmt1(r.actual));
    const proj = row.querySelector('[data-role="proj"]');
    setText(proj, r.hasProjection ? fmt1(r.projected) : '—');
    if(proj) proj.classList.toggle('playing', r.playing);
    const gs = row.querySelector('[data-role="gs"]');
    setText(gs, gameStateLabel(r.game));
    if(gs) gs.classList.toggle('playing', r.playing);
  });
}

function rosterCardHtml(t, startSlots){
  const starterSet = new Set(t.starters), reserveSet = new Set(t.reserve);
  const starterRows = t.starters.map((pid,i)=>({pid, slot:startSlots[i]||''}));
  const benchRows = t.players.filter(pid=>!starterSet.has(pid)&&!reserveSet.has(pid)).map(pid=>({pid, slot:(sleeperCache.players&&sleeperCache.players[pid]&&sleeperCache.players[pid].position)||'BN'}));
  const irRows = t.reserve.map(pid=>({pid, slot:'IR'}));
  function row(r){
    const p = (sleeperCache.players && sleeperCache.players[r.pid]) || {};
    const name = p.full_name || r.pid;
    return `<div class="roster-row"><div class="rp-name"><span class="rp-pos">${escapeHtml(r.slot)}</span><span class="rp-player">${escapeHtml(name)}</span>${injuryTag(p.injury_status)}</div></div>`;
  }
  function section(label, rows){ return rows.length ? `<div class="roster-section-head">${label}</div>${rows.map(row).join('')}` : ''; }
  return `<div class="roster-card">
    <div class="roster-card-head">${avatarHtml(t,'avatar','avatar-fallback')}<div><div class="roster-card-title">${escapeHtml(t.teamName)}</div><div class="roster-card-sub">${t.wins}-${t.losses} &middot; ${escapeHtml(t.ownerName)}</div></div></div>
    ${section('STARTERS', starterRows)}${section('BENCH', benchRows)}${section('IR', irRows)}
  </div>`;
}

/* ============================ SUPER LEAGUE BRACKET ============================ */
function reseedPair(list){ const pairs=[]; const n=list.length; for(let i=0;i<Math.floor(n/2);i++) pairs.push([list[i], list[n-1-i]]); return pairs; }
function nextPow2(n){ let p=2; while(p<n) p*=2; return p; }

async function computeSuperBracket(league, divisions){
  await loadAllSleeperTeams(divisions);
  const groups = divisions.map(d=>{
    const c = divCache(d.id);
    if(!c.info) return [];
    return teamsForDivision(d).sort(compareTeams);
  }).filter(g=>g.length);
  if(!groups.length) return null;

  // A single-division league seeds purely by record; a super league puts each division winner first.
  let ordered;
  if(groups.length === 1){
    ordered = groups[0].slice();
  }else{
    const leaders = groups.map(g=>g[0]).sort(compareTeams);
    const rest = groups.flatMap(g=>g.slice(1)).sort(compareTeams);
    ordered = [...leaders, ...rest];
  }
  const advanceCount = Math.min(league.playoff_advance_count || 8, ordered.length);
  ordered = ordered.slice(0, advanceCount);
  const bracketSize = nextPow2(ordered.length);
  const seeds = ordered.map((t,i)=>({...t, seed:i+1}));

  // When every division is hosted here, playoff rounds are real games: round N is
  // the Nth NFL week after the latest regular season ends.
  const hostedCtxs = divisions.map(d=> divCache(d.id).hosted).filter(Boolean);
  const allHosted = hostedCtxs.length === divisions.length && hostedCtxs.length > 0 && typeof resolveHostedPlayoffGame === 'function';
  const firstPlayoffWeek = allHosted
    ? Math.max(...hostedCtxs.map(h=> h.ctx.settings.start_week + h.ctx.settings.regular_season_weeks))
    : null;

  let pairsForRound = reseedPair(seeds);
  const totalRounds = Math.log2(bracketSize);
  const roundLabels = totalRounds<=1?['Championship']:totalRounds===2?['Semifinals','Championship']:totalRounds===3?['Quarterfinals','Semifinals','Championship']:['Round 1','Round 2','Quarterfinals','Semifinals','Championship'].slice(-totalRounds);

  const rounds = [];
  let settledSoFar = allHosted;
  for(let r=0;r<totalRounds;r++){
    const week = allHosted ? firstPlayoffWeek + r : null;
    const results = await Promise.all(pairsForRound.map(async ([a,b])=>{
      if(!b) return {a, b:null, winner:a, bye:true};
      let game = null;
      if(allHosted && settledSoFar){
        try{ game = await resolveHostedPlayoffGame(a, b, week); }catch(e){ game = null; }
      }
      if(game) return { a, b, winner: game.winner, bye:false, scoreA: game.scoreA, scoreB: game.scoreB, final: game.final, live: !game.final };
      const winner = compareTeams(a,b)<=0 ? a : b;
      return {a,b,winner,bye:false};
    }));
    // Once a round isn't final, later rounds can only be projected.
    if(results.some(x=> !x.bye && !x.final)) settledSoFar = false;
    rounds.push({label:roundLabels[r], week, results});
    const advancing = results.map(res=>res.winner).sort((x,y)=>x.seed-y.seed);
    pairsForRound = reseedPair(advancing);
  }
  const lastGame = rounds[rounds.length-1].results[0];
  return { rounds, champion: lastGame.winner, championFinal: !!lastGame.final, allHosted };
}

/* Draws the bracket into any container — the super league page and a single league's Playoffs tab share it. */
async function renderBracketInto(body, league, divisions){
  const result = await computeSuperBracket(league, divisions);
  if(!result){ body.innerHTML = `<div class="state-msg">Add divisions with live data to build a bracket.</div>`; return; }
  const sameTeam = (x,y)=> x && y && x.roster_id===y.roster_id && x.divisionId===y.divisionId;
  body.innerHTML = `<div class="bracket-scroll">${result.rounds.map(round=>{
    const pairs = round.results.map(res=>{
      if(res.bye) return `<div class="bracket-pair"><div class="bye-slot">Seed ${res.a.seed} &middot; ${escapeHtml(res.a.teamName)} — Bye</div></div>`;
      const aWin = sameTeam(res.winner, res.a);
      const scored = res.scoreA != null;
      const tag = scored ? (res.final ? '' : `<div class="bracket-live">Live</div>`) : '';
      return `<div class="bracket-pair">
        <div class="bracket-slot ${aWin?'winner':'loser'}"><span class="bseed">${res.a.seed}</span><span class="bname">${escapeHtml(res.a.teamName)}</span>${scored?`<span class="bscore num">${fmt1(res.scoreA)}</span>`:''}</div>
        <div class="bracket-slot ${!aWin?'winner':'loser'}"><span class="bseed">${res.b.seed}</span><span class="bname">${escapeHtml(res.b.teamName)}</span>${scored?`<span class="bscore num">${fmt1(res.scoreB)}</span>`:''}</div>
        ${tag}
      </div>`;
    }).join('');
    return `<div class="bracket-col"><div class="bracket-col-head">${round.label}${round.week?` &middot; Wk ${round.week}`:''}</div>${pairs}</div>`;
  }).join('')}</div>
  <div class="champion-box"><div class="champion-label">${result.championFinal ? 'Champion' : 'Projected Champion'}</div><div class="champion-name">&#127942; ${escapeHtml(result.champion.teamName)}</div></div>`;
}

async function renderSuperBracketPage(app, league, divisions){
  const hosted = league.hosting === 'hosted';
  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'bracket') + `
    <div class="hero" style="margin:10px 0 4px;"><h1 style="font-size:28px;">&#9819; Super League Playoffs</h1></div>
    <div class="alert info">Top ${league.playoff_advance_count} teams across all ${divisions.length} divisions. Each division's #1 seed locks into the top seeds; the rest are ranked by record. Every round, lowest surviving seed plays highest surviving seed.
      ${hosted ? 'Every division is hosted here, so playoff games are scored for real — one NFL week per round. Rounds that haven\'t started are projected from records.' : 'This is a projection — divisions run as separate leagues, so cross-division games aren\'t live-tracked.'}</div>
    <div id="bracketBody"><div class="state-msg">Building bracket…</div></div>
  `;
  await renderBracketInto(document.getElementById('bracketBody'), league, divisions);
}

/* ============================ MANAGE (commissioner) ============================ */
function inviteLinkFor(league, code){
  return `${location.origin}${location.pathname}#/join?code=${encodeURIComponent(code)}&name=${encodeURIComponent(league.name)}`;
}
function commishInviteLinkFor(code){
  return `${location.origin}${location.pathname}#/commish-invite?code=${encodeURIComponent(code)}`;
}

/* A read-only field with a copy button — the easiest way to hand out a link. */
function copyFieldHtml(value, label){
  return `<div class="copy-field">
    <input class="form-input" readonly value="${escapeHtml(value)}" aria-label="${escapeHtml(label||'Link')}">
    <button type="button" class="secondary-btn copy-btn" data-copy="${escapeHtml(value)}">Copy</button>
  </div>`;
}
function wireCopyButtons(root){
  root.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const input = btn.previousElementSibling;
      try{ await navigator.clipboard.writeText(btn.dataset.copy); }
      catch(e){ input.select(); if(document.execCommand) document.execCommand('copy'); }
      btn.textContent = 'Copied';
      setTimeout(()=>{ btn.textContent = 'Copy'; }, 1600);
    });
  });
}

async function renderManage(app, league, divisions){
  if(league.builtin){
    app.innerHTML = topbarHtml(`#/league/${league.slug}`)
      + leagueNavHtml(league, divisions, 'manage')
      + `<div class="alert info">"${escapeHtml(league.name)}" is a built-in league defined in the page itself, so it has no commissioner and no settings to edit. Its divisions are wired straight to Sleeper and always read live.</div>`;
    return;
  }
  const isCommish = session && session.user_id === league.commissioner_id;
  if(!isCommish){
    app.innerHTML = topbarHtml(`#/league/${league.slug}`) + (session
      ? `<div class="alert info">Only the league commissioner can manage this league.</div>`
      : `<div class="alert info">You need to log in as this league's commissioner to manage it. <a href="${loginHref()}" style="text-decoration:underline;">Log in here</a>.</div>`);
    return;
  }

  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'manage')
    + `<div class="state-msg">Loading league settings…</div>`;
  let admin;
  try{
    admin = await rpc('get_league_admin', { p_league_id: league.id });
  }catch(e){
    app.innerHTML = topbarHtml(`#/league/${league.slug}`) + leagueNavHtml(league, divisions, 'manage')
      + `<div class="alert error">${escapeHtml(e.message)}</div>`;
    return;
  }

  const hosted = league.hosting === 'hosted';
  const isSuper = league.format !== 'single';
  const byId = {};
  (admin.divisions||[]).forEach(d=>{ byId[d.id] = d; });

  const divisionCards = divisions.map(d=>{
    const a = byId[d.id] || {};
    if(!hosted){
      return `<div class="division-fields">
        <div class="division-fields-head">${escapeHtml(d.name)} &middot; ${platformLabel[d.platform]||d.platform}</div>
        <div class="form-hint">League ID: ${escapeHtml(d.external_league_id||'—')}</div>
      </div>`;
    }
    const divHref = isSuper ? `#/league/${league.slug}/division/${d.id}` : `#/league/${league.slug}`;
    let commish = '';
    if(isSuper){
      if(a.commissioner_id){
        commish = `<div class="manage-commish">
          <span>Division commissioner: <b>${escapeHtml(a.commissioner_name || 'Assigned')}</b></span>
          <button type="button" class="ghost-btn" data-remove-commish="${d.id}">Remove</button>
        </div>`;
      }else if(a.commish_invite_code){
        commish = `<div class="form-hint" style="margin-bottom:6px;">Send this link to the person who'll run this division. It works once.</div>
          ${copyFieldHtml(commishInviteLinkFor(a.commish_invite_code), d.name + ' commissioner invite')}
          <button type="button" class="ghost-btn" data-new-commish="${d.id}" style="margin-top:6px;">Make a new link</button>`;
      }else{
        commish = `<div class="manage-commish"><span class="form-hint">You're running this division yourself.</span>
          <button type="button" class="secondary-btn" data-new-commish="${d.id}">Invite a division commissioner</button></div>`;
      }
    }
    return `<div class="division-fields">
      <div class="division-fields-head" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span>${escapeHtml(d.name)} &middot; ${a.teams_claimed||0}/${a.teams_total||0} teams claimed</span>
        <a href="${divHref}" class="ghost-btn">Open &rarr;</a>
      </div>
      ${commish}
    </div>`;
  }).join('');

  app.innerHTML = topbarHtml(`#/league/${league.slug}`)
    + leagueNavHtml(league, divisions, 'manage') + `
    <div class="hero" style="margin:10px 0 4px;"><h1 style="font-size:28px;">Manage: ${escapeHtml(league.name)}</h1>
      <p><span class="commish-badge">&#9819; Commissioner</span> ${league.finalized ? `<span class="lock-badge">&#128274; Finalized</span>` : ''} ${league.is_public ? `<span class="lock-badge">&#127760; Public</span>` : `<span class="lock-badge">&#128274; Private</span>`} <span class="lock-badge">${hosted ? 'Hosted on League Room' : 'Connected apps'}</span></p>
    </div>
    <div id="manageAlert"></div>

    <div class="section-label">Invite Your League</div>
    <div class="division-fields">
      <div class="form-hint" style="margin-bottom:8px;">Invite code <b>${escapeHtml(admin.invite_code)}</b> &middot; ${admin.member_count} member${admin.member_count===1?'':'s'} so far. This link fills in the league name and code automatically${hosted ? ' — new members then claim an open team' : ''}.</div>
      ${copyFieldHtml(inviteLinkFor(league, admin.invite_code), 'League invite link')}
    </div>

    <div class="section-label">League Settings</div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Playoff Length (weeks)</label><input class="form-input" id="m_playoffweeks" type="number" min="1" max="6" value="${league.playoff_length_weeks}"></div>
      <div class="form-group"><label class="form-label">Teams Advancing to Playoffs</label><input class="form-input" id="m_advance" type="number" min="2" max="64" value="${league.playoff_advance_count}"></div>
    </div>
    <div class="form-group">
      <label class="form-label" style="display:flex;align-items:center;gap:8px;font-size:12.5px;">
        <input type="checkbox" id="m_public" style="width:auto;" ${league.is_public?'checked':''}> Publicly searchable${hosted ? ' — anyone logged in can claim an open team' : ''}
      </label>
    </div>
    <button class="primary-btn" id="saveSettingsBtn">Save Settings</button>
    <button class="secondary-btn" id="finalizeBtn" style="margin-left:8px;" ${league.finalized?'disabled':''}>${league.finalized?'Marked as Finalized':'Mark League as Finalized'}</button>

    <div class="section-label">${isSuper ? 'Divisions' : 'League'}</div>
    <div id="manageDivisions">${divisionCards}</div>
    ${hosted ? `<div class="footnote" style="text-align:left;">Draft order, pick timer, waivers and team management live inside each ${isSuper ? 'division' : 'league'}'s Settings tab.</div>` : ''}
  `;
  wireCopyButtons(app);

  const alertEl = ()=> document.getElementById('manageAlert');
  app.querySelectorAll('[data-new-commish]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      try{
        await rpc('create_division_commish_invite', { p_division_id: btn.dataset.newCommish });
        render();
      }catch(e){
        alertEl().innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
        btn.disabled = false;
      }
    });
  });
  app.querySelectorAll('[data-remove-commish]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remove this division commissioner? You can invite someone else afterwards.')) return;
      btn.disabled = true;
      try{
        await rpc('remove_division_commissioner', { p_division_id: btn.dataset.removeCommish });
        render();
      }catch(e){
        alertEl().innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
        btn.disabled = false;
      }
    });
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    try{
      await rpc('update_league_settings', {
        p_league_id: league.id,
        p_playoff_length_weeks: parseInt(document.getElementById('m_playoffweeks').value, 10),
        p_playoff_advance_count: parseInt(document.getElementById('m_advance').value, 10),
        p_is_public: document.getElementById('m_public').checked
      });
      alertEl().innerHTML = `<div class="alert success">Settings saved.</div>`;
    }catch(e){
      alertEl().innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  });
  document.getElementById('finalizeBtn').addEventListener('click', async ()=>{
    if(!confirm('Mark this league as finalized?')) return;
    try{
      await rpc('set_league_finalized', { p_league_id: league.id });
      render();
    }catch(e){
      alertEl().innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
    }
  });
}

/* ============================ DIVISION COMMISSIONER INVITE ============================ */
async function renderCommishInvite(app, code){
  if(!code){
    app.innerHTML = topbarHtml('#/') + `<div class="alert error">This invite link is missing its code. Ask your league commissioner to send it again.</div>`;
    return;
  }
  if(!session){
    app.innerHTML = topbarHtml('#/') + `
      <div class="hero" style="margin:20px 0 20px;">
        <h1 style="font-size:28px;">You're Invited to Run a Division</h1>
        <p>Log in or create an account first, then we'll bring you right back to accept.</p>
      </div>
      <a class="primary-btn" href="${loginHref()}">Log In or Sign Up</a>`;
    return;
  }
  app.innerHTML = topbarHtml('#/') + `
    <div class="hero" style="margin:20px 0 20px;">
      <h1 style="font-size:28px;">You're Invited to Run a Division</h1>
      <p>As division commissioner you'll run the draft, manage teams and settle disputes for one division of this super league.</p>
    </div>
    <div id="inviteAlert"><div class="alert info">Accepting as <b>${escapeHtml(session.email)}</b>.</div></div>
    <button class="primary-btn" id="acceptCommishBtn">Accept and Open Division</button>`;
  document.getElementById('acceptCommishBtn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Accepting…';
    try{
      const res = await rpc('claim_division_commissioner', { p_code: code });
      location.hash = `#/league/${res.slug}/division/${res.division_id}/settings`;
    }catch(err){
      document.getElementById('inviteAlert').innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = 'Accept and Open Division';
    }
  });
}
