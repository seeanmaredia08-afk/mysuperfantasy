<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Room — My Super Fantasy</title>
<meta name="description" content="Bring 2 to 16 fantasy football divisions into one super league. Live matchups, real-time point projections, combined standings, and a playoff bracket spanning your whole group.">
<meta name="theme-color" content="#0a0e13">
<link rel="canonical" href="https://mysuperfantasy.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="My Super Fantasy">
<meta property="og:url" content="https://mysuperfantasy.com/">
<meta property="og:title" content="League Room — Every division. One league room.">
<meta property="og:description" content="Live matchups, real-time point projections, and combined standings across every division in your fantasy football super league.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="League Room — Every division. One league room.">
<meta name="twitter:description" content="Live matchups, real-time point projections, and combined standings across every division in your fantasy football super league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9468106192958409" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0a0e13; --panel:#121821; --panel-alt:#171f2a; --line:#232d3a;
    --text:#edf1f5; --text-dim:#8b98a8; --text-faint:#5b6675;
    --div1:#4c8bf5; --div1-dim:#2a4770; --div2:#ff6b4a; --div2-dim:#7a3a2a;
    --gold:#d4af37; --gold-dim:#4a3f1f; --live:#3ecf8e; --danger:#e8544a; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;
    background-image:radial-gradient(circle at 15% 0%, rgba(76,139,245,0.07), transparent 40%),radial-gradient(circle at 85% 10%, rgba(255,107,74,0.07), transparent 40%);
    background-attachment:fixed;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;margin:0;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  button,input,select{font-family:inherit;}
  button{cursor:pointer;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  #app{max-width:1040px;margin:0 auto;padding:24px 18px 80px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--div1),var(--div2));display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:15px;color:#0a0e13;}
  .brand-name{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:0.06em;color:var(--text-dim);text-transform:uppercase;}
  .backlink{display:flex;align-items:center;gap:6px;font-family:'Oswald';font-size:13px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-dim);padding:8px 12px;border:1px solid var(--line);border-radius:8px;}
  .backlink:hover{border-color:var(--text-dim);color:var(--text);}
  .topbar-actions{display:flex;gap:8px;align-items:center;}

  .hero{margin:36px 0 30px;}
  .hero-eyebrow{font-family:'Oswald';font-size:12px;letter-spacing:0.28em;color:var(--live);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);}
  .hero h1{font-size:clamp(32px,6vw,50px);line-height:1.03;font-weight:700;}
  .hero p{color:var(--text-dim);margin-top:12px;font-size:15px;max-width:560px;line-height:1.6;}

  .search-bar{display:flex;gap:8px;margin:22px 0 8px;}
  .search-bar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--text);font-size:14px;}
  .search-bar input:focus{outline:none;border-color:var(--live);}
  .search-results{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .search-result{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;}
  .search-result:hover{border-color:var(--live);}
  .sr-name{font-weight:700;font-size:14px;}
  .sr-meta{color:var(--text-faint);font-size:12px;margin-top:2px;}

  .action-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:24px 0;}
  @media(max-width:760px){.action-row{grid-template-columns:1fr;}}
  .action-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.15s;}
  .action-card:hover{border-color:var(--live);transform:translateY(-2px);}
  .action-card .ac-title{font-size:18px;font-weight:700;margin-bottom:4px;}
  .action-card .ac-sub{color:var(--text-faint);font-size:12.5px;}

  .form-group{margin-bottom:16px;}
  .form-label{font-family:'Oswald';font-size:11.5px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;display:block;}
  .form-input,.form-select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;}
  .form-input:focus,.form-select:focus{outline:none;border-color:var(--live);}
  .form-hint{color:var(--text-faint);font-size:11.5px;margin-top:5px;}
  .tabs-row{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;color:var(--text-faint);font-family:'Oswald';font-size:13px;letter-spacing:0.05em;text-transform:uppercase;padding:10px 4px;border-bottom:2px solid transparent;margin-right:14px;}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--live);}
  .tab-btn:hover{color:var(--text);}
  .form-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.form-row2{grid-template-columns:1fr;}}

  .primary-btn{background:var(--live);color:#0a0e13;border:none;border-radius:9px;padding:13px 22px;font-family:'Oswald';font-size:13.5px;letter-spacing:0.05em;text-transform:uppercase;font-weight:700;}
  .primary-btn:hover{filter:brightness(1.08);}
  .primary-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .secondary-btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 18px;font-family:'Oswald';font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;}
  .secondary-btn:hover{border-color:var(--text-dim);}
  .ghost-btn{background:transparent;color:var(--text-faint);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:'Oswald';font-size:11.5px;}

  .division-fields{background:var(--panel-alt);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
  .division-fields-head{font-family:'Oswald';font-size:12px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}

  .alert{padding:12px 14px;border-radius:8px;font-size:13px;margin:12px 0;}
  .alert.error{background:rgba(232,84,74,0.12);color:#ff9a91;border:1px solid rgba(232,84,74,0.3);}
  .alert.success{background:rgba(62,207,142,0.12);color:#8fe8bd;border:1px solid rgba(62,207,142,0.3);}
  .alert.info{background:rgba(76,139,245,0.1);color:#a8c6fb;border:1px solid rgba(76,139,245,0.3);}

  .tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0;}
  .tile{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;}
  .tile:hover{transform:translateY(-2px);border-color:var(--live);}
  .tile-bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--div1);}
  .tile-label{font-family:'Oswald';font-size:11px;letter-spacing:0.15em;color:var(--text-dim);margin-bottom:4px;}
  .tile-title{font-size:18px;font-weight:600;}
  .tile-sub{color:var(--text-faint);font-size:11.5px;margin-top:8px;}
  .tile.super{background:linear-gradient(120deg, rgba(212,175,55,0.10), var(--panel) 55%);border:1px solid var(--gold-dim);}
  .tile.super .tile-bar{background:var(--gold);}
  .tile.super .tile-title{color:var(--gold);}
  .platform-chip{font-family:'Oswald';font-size:9px;letter-spacing:0.08em;padding:2px 6px;border-radius:4px;background:var(--panel-alt);color:var(--text-faint);text-transform:uppercase;}

  .section-label{font-family:'Oswald';font-size:12px;letter-spacing:0.15em;color:var(--text-faint);text-transform:uppercase;margin:30px 0 10px;}
  table.standings{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.standings th{text-align:left;color:var(--text-faint);font-family:'Oswald';font-weight:500;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);}
  table.standings td{padding:10px;border-bottom:1px solid rgba(35,45,58,0.5);}
  table.standings td.num,table.standings th.num{text-align:right;}
  .table-scroll{overflow-x:auto;}
  .rank-cell{width:28px;color:var(--text-faint);font-family:'Oswald';}
  .team-cell{display:flex;align-items:center;gap:9px;}
  .avatar-fallback{width:26px;height:26px;border-radius:6px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-faint);flex:none;}
  .avatar{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:none;}
  .team-name{font-weight:600;}
  .owner-name{color:var(--text-faint);font-size:11.5px;}
  .leader-row td{background:linear-gradient(90deg, rgba(212,175,55,0.10), transparent);}
  .crown{color:var(--gold);font-size:12px;margin-right:2px;}
  .div-chip{font-family:'Oswald';font-size:9px;letter-spacing:0.08em;padding:2px 6px;border-radius:4px;color:#0a0e13;font-weight:700;background:var(--div1);}

  .matchup-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .matchup-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px;gap:12px;}
  .mt-team{display:flex;align-items:center;gap:10px;min-width:0;}
  .mt-team.right{flex-direction:row-reverse;text-align:right;}
  .mt-avatar,.mt-avatar-fallback{width:36px;height:36px;border-radius:9px;background:var(--panel-alt);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text-faint);}
  .mt-info{min-width:0;}
  .mt-team-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mt-record{color:var(--text-faint);font-size:11px;}
  .mt-score{font-family:'Oswald';font-size:26px;font-weight:600;}
  .mt-team.loser .mt-score,.mt-team.loser .mt-team-name{color:var(--text-faint);}
  .mt-center{text-align:center;color:var(--text-faint);}
  .mt-vs{font-family:'Oswald';font-size:10px;letter-spacing:0.15em;}
  .injury-tag{font-family:'Oswald';font-size:8.5px;padding:1px 4px;border-radius:3px;margin-left:5px;text-transform:uppercase;}
  .injury-tag.q{background:rgba(212,175,55,0.2);color:var(--gold);}
  .injury-tag.out,.injury-tag.ir{background:rgba(232,84,74,0.2);color:#ff9a91;}
  .injury-tag.d{background:rgba(232,84,74,0.15);color:#ff9a91;}

  .expand-row{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-top:1px solid var(--line);font-family:'Oswald';font-size:11px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;}
  .expand-row:hover{color:var(--text);background:var(--panel-alt);}
  .roster-detail{display:none;border-top:1px solid var(--line);padding:14px 18px;}
  .roster-detail.open{display:block;}
  .roster-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;}
  @media(max-width:560px){.roster-grid{grid-template-columns:1fr;gap:16px 0;}}
  .roster-col-head{font-family:'Oswald';font-size:10.5px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;padding:8px 0 6px;border-bottom:1px solid var(--line);margin-bottom:2px;}
  .roster-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed rgba(35,45,58,0.6);gap:6px;}
  .rp-name{display:flex;gap:7px;align-items:center;min-width:0;}
  .rp-pos{font-family:'Oswald';font-size:9px;color:var(--text-faint);background:var(--panel-alt);padding:1px 5px;border-radius:4px;flex:none;min-width:24px;text-align:center;}
  .rp-player{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rp-proj{color:var(--text-faint);font-size:10.5px;margin-left:4px;}
  .rp-pts{font-family:'Oswald';flex:none;}
  .rp-scores{display:flex;align-items:baseline;gap:8px;flex:none;}
  .rp-proj-val{font-family:'Oswald';font-size:11px;color:var(--text-faint);min-width:30px;text-align:right;}
  .rp-proj-val.playing{color:var(--live);}
  .rp-pts{min-width:34px;text-align:right;}
  .roster-col-sub{display:flex;justify-content:flex-end;gap:8px;font-family:'Oswald';font-size:8.5px;letter-spacing:0.1em;color:var(--text-faint);text-transform:uppercase;padding-bottom:2px;}
  .roster-col-sub span:first-child{min-width:30px;text-align:right;}
  .roster-col-sub span:last-child{min-width:34px;text-align:right;}
  .rp-gamestate{font-family:'Oswald';font-size:8.5px;color:var(--text-faint);letter-spacing:0.04em;margin-left:5px;white-space:nowrap;}
  .rp-gamestate.playing{color:var(--live);}

  /* live projections */
  .mt-side{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .mt-proj{font-family:'Oswald';font-size:10px;letter-spacing:0.06em;color:var(--text-faint);text-transform:uppercase;white-space:nowrap;}
  .mt-proj.playing{color:var(--live);}
  .mt-proj.winning{color:var(--gold);}
  .live-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 2px;}
  .live-pill{display:inline-flex;align-items:center;gap:7px;font-family:'Oswald';font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-faint);border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;}
  .live-pill.on{color:var(--live);border-color:rgba(62,207,142,0.35);}
  .live-pill .dot-live{background:var(--text-faint);box-shadow:none;}
  .live-pill.on .dot-live{background:var(--live);box-shadow:0 0 8px var(--live);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .refresh-btn{background:transparent;color:var(--text-faint);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-family:'Oswald';font-size:11px;letter-spacing:0.09em;text-transform:uppercase;}
  .refresh-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .refresh-btn:disabled{opacity:0.5;cursor:default;}
  @keyframes ptsflash{0%{color:var(--live);transform:scale(1.06);}100%{color:inherit;transform:scale(1);}}
  .flash{animation:ptsflash 1.1s ease-out;}

  /* win probability */
  .winbar-wrap{padding:10px 18px 12px;border-top:1px solid var(--line);}
  .winbar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .winbar-pct{font-family:'Oswald';font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .winbar-label{font-family:'Oswald';font-size:9.5px;letter-spacing:0.14em;color:var(--text-faint);text-transform:uppercase;}
  .winbar{height:6px;border-radius:3px;background:var(--div2-dim);overflow:hidden;}
  .winbar-fill{height:100%;background:var(--div1);border-radius:3px 0 0 3px;transition:width .6s cubic-bezier(.4,0,.2,1);}
  .winbar-wrap.settled .winbar-label{color:var(--text-faint);}
  .winbar-wrap.settled .winbar-fill{background:var(--live);}
  @media(prefers-reduced-motion:reduce){.winbar-fill{transition:none;}}

  /* sport picker */
  .sport-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
  .sport-opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--text-dim);text-align:left;}
  .sport-opt:hover{border-color:var(--text-dim);color:var(--text);}
  .sport-opt.active{border-color:var(--live);background:var(--panel-alt);color:var(--text);}
  .sport-name{font-family:'Oswald';font-size:13.5px;letter-spacing:0.03em;text-transform:uppercase;font-weight:600;}
  .sport-sub{font-size:10.5px;color:var(--text-faint);}
  .sport-live{position:absolute;top:8px;right:9px;font-family:'Oswald';font-size:8px;letter-spacing:0.06em;text-transform:uppercase;color:var(--live);}

  /* injury report */
  .inj-summary{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:10px;}
  .inj-chip{font-family:'Oswald';font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-dim);background:var(--panel-alt);border:1px solid var(--line);border-radius:5px;padding:3px 8px;}
  .inj-chip b{color:var(--text);}
  .inj-total{font-size:11px;color:var(--text-faint);margin-left:auto;}
  .inj-player{display:flex;align-items:center;gap:7px;}
  .inj-name{font-weight:600;}
  .inj-starter{font-family:'Oswald';font-size:8px;letter-spacing:0.06em;text-transform:uppercase;color:var(--div1);border:1px solid var(--div1-dim);border-radius:3px;padding:1px 4px;}
  .inj-nfl{font-size:10.5px;color:var(--text-faint);margin-top:2px;padding-left:1px;}
  .inj-detail,.inj-team{color:var(--text-dim);font-size:12.5px;}

  /* free agents */
  .fa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;}
  .fa-tab{font-family:'Oswald';font-size:11.5px;letter-spacing:0.05em;color:var(--text-faint);background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 12px;}
  .fa-tab:hover{color:var(--text);border-color:var(--text-dim);}
  .fa-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;}
  .fa-note{font-size:11px;color:var(--text-faint);margin-left:auto;}
  .fa-nfl{color:var(--text-faint);font-size:12px;}
  .fa-proj{font-family:'Oswald';font-weight:600;}
  .fa-healthy{color:var(--text-faint);}
  @media(prefers-reduced-motion:reduce){.flash{animation:none;}.live-pill.on .dot-live{animation:none;}}

  .week-tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0;margin-bottom:4px;border-bottom:1px solid var(--line);}
  .week-tab{flex:none;font-family:'Oswald';font-size:12.5px;color:var(--text-faint);background:transparent;border:1px solid var(--line);padding:7px 13px;border-radius:20px;white-space:nowrap;}
  .week-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;}

  .subnav{display:flex;gap:4px;overflow-x:auto;margin:16px 0 4px;border-bottom:1px solid var(--line);}
  .subnav a{flex:none;font-family:'Oswald';font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);padding:9px 13px;border-bottom:2px solid transparent;white-space:nowrap;}
  .subnav a.active{color:var(--text);border-bottom-color:var(--text);}
  .subnav a:hover{color:var(--text);}
  .subnav a.gold{color:var(--gold);}
  .subnav a.gold.active{border-bottom-color:var(--gold);}
  .subnav{position:sticky;top:0;z-index:5;background:var(--bg);}

  .state-msg{color:var(--text-faint);font-size:13px;padding:26px 4px;text-align:center;}
  .state-msg.error{color:var(--danger);}
  .footnote{color:var(--text-faint);font-size:11.5px;text-align:center;margin-top:30px;line-height:1.6;}
  .skeleton{background:linear-gradient(90deg,var(--panel-alt) 25%, #1e2733 37%, var(--panel-alt) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  .roster-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media(max-width:700px){.roster-cards{grid-template-columns:1fr;}}
  .roster-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}

/* ============================ SESSION ============================

/* ============================ SUPABASE HELPERS ============================ */
/* Turns raw PostgREST / network failures into something a manager can act on. */
function friendlyDbError(res, body){
  const code = body && body.code;
  const msg = (body && (body.message || body.msg || body.error_description)) || '';
  if(code === 'PGRST202' || code === '42883' || /could not find the function/i.test(msg))
    return 'The league database needs an update before this works. (Commissioner: run supabase/schema.sql in Supabase.)';
  if(code === 'PGRST205' || code === '42P01' || /could not find the table/i.test(msg))
    return 'The league database is missing tables. (Commissioner: run supabase/schema.sql in Supabase.)';
  if(code === '42703' || /column .* does not exist/i.test(msg))
    return 'The league database is out of date. (Commissioner: run supabase/schema.sql in Supabase.)';
  if(res && res.status === 401) return 'Your login has expired. Log in again.';
  return msg || 'Request failed';
}

async function sbFetch(path, opts={}){
  await ensureFreshSession();
  const headers = { 'apikey': SB_ANON, 'Content-Type':'application/json', ...(opts.headers||{}) };
  headers.Authorization = 'Bearer ' + (session ? session.access_token : SB_ANON);
  let res;
  try{
    res = await fetch(SB_URL + path, { ...opts, headers });
  }catch(e){
    throw new Error("Can't reach the league database right now. Check your connection and try again.");
  }
  if(!res.ok){
    let body = null;
    try{ body = await res.json(); }catch(e){}
    if(res.status === 401 && session){ saveSession(null); }
    throw new Error(friendlyDbError(res, body));
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* Every hosted-league read and write goes through a database function. */
function rpc(name, args){
  return sbFetch('/rest/v1/rpc/' + name, { method:'POST', body: JSON.stringify(args || {}) });
}

/* Supabase Auth reports errors as { error_code, msg }. */
function friendlyAuthError(status, data, fallbackMsg){
  const code = data.error_code || '';
  const msg = data.msg || data.error_description || data.message || '';
  if(code === 'invalid_credentials') return 'Incorrect email or password.';
  if(code === 'otp_expired') return 'That code is incorrect or has expired. Check the email, or send yourself a new code.';
  if(code === 'same_password') return 'Your new password has to be different from your old one.';
  if(code === 'weak_password') return msg || 'Choose a stronger password.';
  if(code === 'email_address_not_authorized' || /not authorized/i.test(msg))
    return "We couldn't email that address because this site's email service isn't fully set up yet. Ask your league commissioner for help.";
  if(status === 429 || /rate limit/i.test(code + ' ' + msg))
    return 'Too many requests right now. Wait a minute, then try again.';
  // Anything else: keep Supabase's own words and the status, so a failure can actually be diagnosed.
  const detail = [status && `error ${status}`, code, msg].filter(Boolean).join(' · ');
  if(status >= 500 || !msg) return `${fallbackMsg}${detail ? ` (${detail})` : ''}`;
  return msg;
}

async function authRequest(path, body, fallbackMsg, opts={}){
  const headers = { 'apikey':SB_ANON, 'Content-Type':'application/json' };
  if(opts.token) headers.Authorization = 'Bearer ' + opts.token;
  let res;
  try{
    res = await fetch(SB_URL + path, { method: opts.method || 'POST', headers, body: JSON.stringify(body) });
  }catch(e){
    throw new Error("Can't reach the login service right now. Check your connection and try again.");
  }

    if(!data.msg && !data.message && !data.error_description && raw && !/^\s*</.test(raw)) data.msg = raw.slice(0, 200);
    throw new Error(friendlyAuthError(res.status, data, fallbackMsg));
  }
  return data;
}

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-+$)/g,'').slice(0,60); }

/* ============================ SLEEPER DATA LAYER ============================ */
const sleeperCache = { players:null, playersPromise:null, nflState:null, byDivision:{} };

async function sleeperApi(path){
  const res = await fetch(SLEEPER + path);
  if(!res.ok) throw new Error('Sleeper error ' + res.status);
  return res.json();
}
/* `sleeperCache.players` always holds the map for the sport last loaded; every
   consumer works on one sport at a time, so a single active map is enough. */
function ensurePlayers(sport){
  sport = sport || 'nfl';
  sleeperCache.playersBySport = sleeperCache.playersBySport || {};
  const cached = sleeperCache.playersBySport[sport];
  if(cached){ sleeperCache.players = cached; return Promise.resolve(cached); }
  sleeperCache.playersPromises = sleeperCache.playersPromises || {};
  if(sleeperCache.playersPromises[sport]) return sleeperCache.playersPromises[sport];
  sleeperCache.playersPromises[sport] = sleeperApi(`/players/${sport}`)
    .then(d=>{ sleeperCache.playersBySport[sport]=d; sleeperCache.players=d; return d; })
    .catch(e=>{ delete sleeperCache.playersPromises[sport]; throw e; });
  return sleeperCache.playersPromises[sport];
}
async function ensureNflState(){
  if(sleeperCache.nflState) return sleeperCache.nflState;

  sleeperCache.byDivision[divId] = sleeperCache.byDivision[divId] || { info:null, users:null, rosters:null, matchups:{} };

}

function teamsForDivision(division){

function winPct(t){ const g=t.wins+t.losses+t.ties; return g?(t.wins+t.ties*0.5)/g:0; }
function compareTeams(a,b){
  const pa=winPct(a), pb=winPct(b);
  if(pb!==pa) return pb-pa;
  return (b.ptsFor||0)-(a.ptsFor||0);
}

  const cls = s==='questionable'?'q':(s==='doubtful'?'d':(['out','ir','injured reserve'].includes(s)?'out':''));

/* ============================ LIVE PROJECTIONS ============================
   A player's live projection is what they're on pace to finish the week with:

     projected = points already scored + (full-week projection x share of game left)

   Before kickoff that's the full projection; at the final whistle it collapses to
   the actual score; mid-game it decays as the clock runs down. Weekly projections
   come back as raw stat lines, so we price them with each league's own scoring
   settings rather than assuming PPR.                                           */

const PROJ_POSITIONS = ['QB','RB','WR','TE','K','DEF'];
const SCORES_TTL_MS = 20000;
const liveCache = { proj:{}, projPromise:{}, scoresByTeam:{}, scoresKey:null, scoresAt:0, scoresPromise:null };

async function sleeperData(path){
  const res = await fetch(SLEEPER_DATA + path);
  if(!res.ok) throw new Error('Sleeper error ' + res.status);
  return res.json();
}

/* Weekly projections never change once published, so fetch each week at most once. */
function ensureProjections(season, week){
  const key = season + '-' + week;
  if(liveCache.proj[key]) return Promise.resolve(liveCache.proj[key]);
  if(liveCache.projPromise[key]) return liveCache.projPromise[key];
  const qs = PROJ_POSITIONS.map(p=>'position[]='+p).join('&');
  liveCache.projPromise[key] = sleeperData(`/projections/nfl/${season}/${week}?season_type=regular&${qs}&order_by=ppr`)
    .then(rows=>{
      const byId = {};
      (rows||[]).forEach(r=>{ if(r.player_id && r.stats) byId[r.player_id] = r.stats; });
      liveCache.proj[key] = byId;
      return byId;
    })
    .catch(e=>{ delete liveCache.projPromise[key]; throw e; });
  return liveCache.projPromise[key];
}

/* Live game clocks. Short TTL so a burst of callers shares one request. */
function refreshScores(season, week, force){
  const key = season + '-' + week;
  const fresh = liveCache.scoresKey===key && (Date.now()-liveCache.scoresAt) < SCORES_TTL_MS;
  if(fresh && !force) return Promise.resolve(liveCache.scoresByTeam);
  if(liveCache.scoresPromise) return liveCache.scoresPromise;
  liveCache.scoresPromise = sleeperData(`/scores/nfl/regular/${season}/${week}`)
    .then(games=>{
      const byTeam = {};
      (games||[]).forEach(g=>{
        const m = g.metadata || {};
        if(m.home_team) byTeam[m.home_team] = g;
        if(m.away_team) byTeam[m.away_team] = g;
      });
      liveCache.scoresByTeam = byTeam; liveCache.scoresKey = key; liveCache.scoresAt = Date.now();
      return byTeam;
    })
    .finally(()=>{ liveCache.scoresPromise = null; });
  return liveCache.scoresPromise;
}

function gameForPlayer(pid){
  const p = (sleeperCache.players && sleeperCache.players[pid]) || null;
  // Team defenses use the team abbreviation as their player id.
  const team = (p && p.team) || (/^[A-Z]{2,3}$/.test(pid) ? pid : null);
  return team ? (liveCache.scoresByTeam[team] || null) : null;
}

/* Share of the player's game still to be played, 0–1. */
function fractionRemaining(game){
  if(!game) return 0;                       // bye week, or no game found
  const m = game.metadata || {};
  if(m.is_over || game.status==='complete' || m.status==='closed') return 0;
  if(!m.has_started || game.status==='pre_game') return 1;
  if(m.is_overtime) return 0.03;            // sudden death — assume nearly done
  const q = parseInt(m.quarter_num, 10);
  if(!q) return 1;
  const bits = String(m.time_remaining || '0:00').split(':');
  const secs = (parseInt(bits[0],10)||0)*60 + (parseInt(bits[1],10)||0);
  const remaining = Math.max(0, (4-q)*900 + secs);
  return Math.max(0, Math.min(1, remaining/3600));
}

function gameStateLabel(game){
  if(!game) return '';
  const m = game.metadata || {};
  if(m.is_over || game.status==='complete') return 'Final';
  if(!m.has_started || game.status==='pre_game') return '';
  if(m.is_overtime) return 'OT';
  const q = parseInt(m.quarter_num,10);
  if(!q) return '';
  const t = String(m.time_remaining||'').trim();
  return 'Q'+q + (t && t!=='00:00' ? ' '+t.replace(/^0/,'') : '');
}

/* Price a raw projected stat line using the league's scoring settings. */
function projectedPoints(stats, scoring){
  if(!stats) return 0;
  if(scoring && Object.keys(scoring).length){
    let total = 0;
    for(const key in scoring){
      const v = stats[key];
      if(typeof v === 'number') total += v * scoring[key];
    }
    return total;
  }
  return stats.pts_ppr || stats.pts_half_ppr || stats.pts_std || 0;
}

/* Everything the UI needs for one starter. */
function playerLive(pid, actualPts, scoring, season, week){
  const table = liveCache.proj[season + '-' + week];
  const full = table ? projectedPoints(table[pid], scoring) : 0;
  const game = gameForPlayer(pid);
  const frac = fractionRemaining(game);
  return {
    actual: actualPts || 0,
    projected: (actualPts || 0) + full * frac,
    full, frac, game,
    playing: frac > 0 && frac < 1,
    yetToPlay: frac >= 1,
    hasProjection: !!(table && table[pid])
  };
}

/* ============================ AUTO-REFRESH LOOP ============================
   One loop at a time, owned by whichever view is on screen. Every render()
   tears the previous one down, and a generation counter makes sure a response
   that lands after the user has navigated away is discarded instead of
   painting into a detached DOM.                                              */

const LIVE_INTERVAL_ACTIVE = 30000;   // a game is in progress
const LIVE_INTERVAL_IDLE   = 300000;  // current week, but nothing kicked off
const live = { timer:null, clock:null, ctx:null, gen:0, busy:false, lastAt:0, anyLive:false };

function stopLive(){
  if(live.timer){ clearTimeout(live.timer); live.timer = null; }
  if(live.clock){ clearInterval(live.clock); live.clock = null; }
  live.ctx = null; live.busy = false; live.anyLive = false; live.gen++;
}

function startLive(ctx){
  // A view that was navigated away from mid-load must not install a loop.
  if(ctx.anchor && !document.body.contains(ctx.anchor)) return;
  if(live.timer){ clearTimeout(live.timer); live.timer = null; }
  if(live.clock){ clearInterval(live.clock); live.clock = null; }
  live.gen++; ctx.gen = live.gen; live.ctx = ctx; live.busy = false;
  live.lastAt = Date.now();
  live.clock = setInterval(updateLiveStatus, 10000);
  updateLiveStatus();
  scheduleLive();
}

function scheduleLive(){
  if(live.timer){ clearTimeout(live.timer); live.timer = null; }
  if(!live.ctx || !live.ctx.pollable) return;
  // A view can ask for its own cadence (a live draft polls every few seconds).
  const interval = typeof live.ctx.interval === 'function' ? live.ctx.interval() : live.ctx.interval;
  live.timer = setTimeout(tickLive, interval || (live.anyLive ? LIVE_INTERVAL_ACTIVE : LIVE_INTERVAL_IDLE));
}

async function tickLive(manual){
  const ctx = live.ctx;
  if(!ctx || live.busy) return;
  if(ctx.anchor && !document.body.contains(ctx.anchor)){ stopLive(); return; }
  if(!ctx.pollable && !manual) return;
  // Don't burn requests on a background tab; we refresh the moment it's shown again.
  if(document.hidden && !manual){ scheduleLive(); return; }
  const gen = ctx.gen;
  live.busy = true;
  updateLiveStatus('refreshing');
  try{
    await ctx.refresh();
    if(gen !== live.gen) return;
    live.lastAt = Date.now();
  }catch(e){
    // Transient blip — leave the last good numbers up rather than blanking them.
    console.warn('Live refresh failed', e);
  }finally{
    if(gen === live.gen){ live.busy = false; updateLiveStatus(); scheduleLive(); }
  }
}

function agoText(ts){
  if(!ts) return 'just now';
  const s = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s < 5) return 'just now';
  if(s < 60) return s + 's ago';
  const m = Math.round(s/60);
  return m + (m===1 ? ' min ago' : ' mins ago');
}

function updateLiveStatus(state){
  const el = document.getElementById('liveStatus');
  if(!el) return;
  const ctx = live.ctx;
  const btn = document.getElementById('liveRefreshBtn');
  if(btn) btn.disabled = !!live.busy;
  if(!ctx){ el.innerHTML = ''; el.className = 'live-pill'; return; }
  let text;
  if(state === 'refreshing') text = 'Updating…';
  else if(!ctx.pollable) text = ctx.idleText || 'Week complete';
  else if(live.anyLive) text = 'Live · ' + agoText(live.lastAt);
  else text = 'Auto-updating · ' + agoText(live.lastAt);
  el.className = 'live-pill' + (live.anyLive && state!=='refreshing' ? ' on' : '');
  el.innerHTML = `<span class="dot-live"></span>${escapeHtml(text)}`;
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || !live.ctx || !live.ctx.pollable) return;
  // Catch up on whatever happened while the tab was in the background.
  if(Date.now() - live.lastAt > LIVE_INTERVAL_ACTIVE) tickLive(true);
  else updateLiveStatus();
});

/* ============================ WIN PROBABILITY ============================
   Each team's final score is treated as a normal distribution centred on its
   live projection, and win probability is P(A - B > 0).

   The spread is built per starter from two ideas:

   1. Position-specific volatility. A full game's standard deviation is
      cv × projection + base. Quarterbacks are steadier than receivers and
      defenses are the noisiest; the base keeps a low projection from implying
      near-certainty (a 4-point tight end can still catch two touchdowns).

   2. Uncertainty shrinks with the square root of game time left, not linearly.
      Scoring accrues like a random walk, so variance is proportional to time
      remaining. The old linear decay called games far too early — Sleeper
      rebuilt its own model specifically to stop premature "certain win/loss"
      calls, so the sqrt decay is the closer match.

   WINPROB_SPREAD scales every standard deviation at once, so the whole curve
   can be calibrated against real Sleeper numbers with a single constant.   */
const POSITION_VOLATILITY = {
  QB:  { cv:0.40, base:1.5 },
  RB:  { cv:0.60, base:1.5 },
  WR:  { cv:0.65, base:1.5 },
  TE:  { cv:0.70, base:1.5 },
  K:   { cv:0.50, base:1.5 },
  DEF: { cv:0.80, base:2.0 }
};
const DEFAULT_VOLATILITY = { cv:0.65, base:1.5 };
const WINPROB_SPREAD = 1.0;

/* Abramowitz & Stegun 7.1.26 — plenty accurate for a displayed percentage. */
function normalCdf(z){
  const sign = z < 0 ? -1 : 1;
  const x = Math.abs(z) / Math.SQRT2;
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429*t - 1.453152027)*t + 1.421413741)*t - 0.284496736)*t + 0.254829592) * t * Math.exp(-x*x);
  return 0.5 * (1 + sign * y);
}

function playerSigma(r){
  if(!r.pid || r.pid === '0' || !(r.frac > 0)) return 0;   // empty slot or game over
  const p = sleeperCache.players && sleeperCache.players[r.pid];
  const vol = POSITION_VOLATILITY[(p && p.position) || r.position] || DEFAULT_VOLATILITY;
  const fullGameSd = vol.cv * Math.max(0, r.full || 0) + vol.base;
  return WINPROB_SPREAD * fullGameSd * Math.sqrt(Math.min(1, r.frac));
}

function teamSigma(le){
  // Independent contributions, so variances add.
  const variance = le.rows.reduce((sum,r)=> sum + Math.pow(playerSigma(r), 2), 0);
  return Math.sqrt(variance);
}

/* Returns team A's chance of winning, 0-1. */
function winProbability(l1, l2){
  if(!l1 || !l2) return null;
  const margin = l1.projected - l2.projected;
  const sigma = Math.sqrt(Math.pow(teamSigma(l1),2) + Math.pow(teamSigma(l2),2));
  if(sigma < 0.5){
    // Nothing meaningful left to play — the current margin decides it.
    if(Math.abs(margin) < 0.05) return 0.5;
    return margin > 0 ? 1 : 0;
  }
  return normalCdf(margin / sigma);
}

function formatWinPct(p){
  if(p == null) return '';
  if(p === 1) return '100%';   // decided: nothing left to play
  if(p === 0) return '0%';
  if(p >= 0.9995) return '>99.9%';
  if(p <= 0.0005) return '<0.1%';
  if(p >= 0.995 || p <= 0.005) return (p*100).toFixed(1) + '%';
  return Math.round(p*100) + '%';
}

function entryLive(entry, scoring, season, week){
  const starters = entry.starters || [];
  const pts = entry.starters_points || [];
  const rows = starters.map((pid,i)=> ({ pid, ...playerLive(pid, pts[i], scoring, season, week) }));
  // Sleeper's own matchup total is authoritative for points already banked.
  const actual = entry.points != null ? entry.points : rows.reduce((s,r)=>s+r.actual,0);
  const delta = rows.reduce((s,r)=>s + r.full*r.frac, 0);
  return { rows, actual, projected: actual + delta, anyPlaying: rows.some(r=>r.playing) };
}

/* ============================ ROUTER ============================ */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [pathPart, queryPart] = h.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart) queryPart.split('&').forEach(pair=>{ const [k,v]=pair.split('='); query[k]=decodeURIComponent(v||''); });
  if(parts[0]==='create') return {view:'create'};
  if(parts[0]==='account' || parts[0]==='commissioner') return {view:'account', returnCode: query.code||'', returnName: query.name||'', next: query.next||''};
  if(parts[0]==='join') return {view:'join', code: query.code||'', name: query.name||''};
  if(parts[0]==='commish-invite') return {view:'commishInvite', code: query.code||''};
  if(parts[0]==='forgot-password') return {view:'forgotPassword', next: query.next||''};
  if(parts[0]==='league' && parts[1]) return {view:'league', slug:parts[1], sub:parts[2], arg:parts[3], tab:parts[4]};
  return {view:'landing'};
}

async function render(){
  const r = route();
  const app = document.getElementById('app');
  stopLive(); // every view owns at most one refresh loop
  try{
    if(r.view==='landing') await renderLanding(app);
    else if(r.view==='create') await renderCreate(app);
    else if(r.view==='account') await renderAccount(app, r.returnCode, r.returnName, r.next);
    else if(r.view==='join') await renderJoin(app, r.code, r.name);
    else if(r.view==='commishInvite') await renderCommishInvite(app, r.code);
    else if(r.view==='forgotPassword') await renderForgotPassword(app, r.next);
    else if(r.view==='league') await renderLeagueRoute(app, r);
    focusActiveNav();
  }catch(err){
    console.error(err);
    app.innerHTML = topbarHtml() + `<div class="state-msg error">Something went wrong — ${escapeHtml(err.message||'unknown error')}</div>`;
  }
}

/* On narrow screens the sub-nav scrolls sideways, so bring the current tab into
   view rather than leaving the user looking at a bar that seems unrelated.
   Sets scrollLeft directly — scrollIntoView would also jump the page vertically. */
function focusActiveNav(){
  const active = document.querySelector('.subnav a.active');
  if(!active) return;
  const bar = active.parentElement;
  if(bar.scrollWidth <= bar.clientWidth) return;
  bar.scrollLeft = Math.max(0, active.offsetLeft - (bar.clientWidth - active.offsetWidth)/2);
}

/* Sub-navigation shared by every page inside a league, so the live view is
   always one tap from the overview, a sibling division, or the bracket. */

    return `<div class="subnav">

      ${session && session.user_id === league.commissioner_id ? item(`#/league/${league.slug}/manage`, 'Manage', 'manage') : ''}

  return `<div class="subnav">

    ${(divisions||[]).map(d=>item(`#/league/${league.slug}/division/${d.id}`, d.name, 'div:'+d.id)).join('')}

  </div>`;
}

    const found = [...builtins.map(l=>searchResultHtml(l,'Built-in')), ...((rows||[]).map(l=>searchResultHtml(l)))];

}

            <input class="form-input" type="email" id="fpEmail" autocomplete="email" value="${escapeHtml(st.email)}" required></div>
          <button type="submit" class="primary-btn" id="fpSendBtn">Send Code</button>
          <div class="auth-actions">${backToLogin}</div>
        </form>`;
      const input = document.getElementById('fpEmail');
      if(!st.email) input.focus();
      document.getElementById('fpEmailForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const email = input.value.trim();
        const alertEl = document.getElementById('fpAlert');
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ alertEl.innerHTML = alertHtml('error', 'Enter a valid email address.'); return; }
        const btn = document.getElementById('fpSendBtn');
        btn.disabled = true; btn.textContent = 'Sending…';
        try{
          await authSendRecoveryCode(email);
          st.email = email; st.step = 'code'; st.resendAt = Date.now() + RECOVERY_RESEND_MS;
          paint();
        }catch(err){
          alertEl.innerHTML = alertHtml('error', err.message);
          btn.disabled = false; btn.textContent = 'Send Code';
        }
      });
      return;
    }

    if(st.step === 'code'){
      app.innerHTML = topbarHtml('#/account') + `
        <div class="hero auth-hero">${stepsHtml('code')}
          <h1 style="font-size:28px;">Enter Your Code</h1>
          <p>If there's an account for <b>${escapeHtml(st.email)}</b>, we've emailed it a verification code. The code expires in 1 hour — check your spam folder if it doesn't arrive.</p>
        </div>
        <div id="fpAlert"></div>
        <form id="fpCodeForm" class="auth-card" novalidate>
          <div class="form-group"><label class="form-label" for="fpCode">Verification Code</label>
            <input class="form-input otp-input" id="fpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••" required></div>
          <button type="submit" class="primary-btn" id="fpVerifyBtn">Verify Code</button>
          <div class="auth-actions">
            <button type="button" class="linklike" id="fpResend"></button>
            <button type="button" class="linklike" id="fpChangeEmail">Use a different email</button>
          </div>
        </form>`;
      const codeInput = document.getElementById('fpCode');
      codeInput.focus();
      // Codes are digits; people often paste them with spaces.
      codeInput.addEventListener('input', ()=>{ codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 10); });

      const resendBtn = document.getElementById('fpResend');
      const paintResend = ()=>{
        const wait = Math.ceil((st.resendAt - Date.now()) / 1000);
        resendBtn.disabled = wait > 0;
        resendBtn.textContent = wait > 0 ? `Send a new code in ${wait}s` : 'Send a new code';
        if(wait <= 0) stopTicker();
      };
      paintResend();
      ticker = setInterval(()=>{ if(!document.body.contains(resendBtn)) stopTicker(); else paintResend(); }, 1000);

      resendBtn.addEventListener('click', async ()=>{
        const alertEl = document.getElementById('fpAlert');
        resendBtn.disabled = true;
        try{
          await authSendRecoveryCode(st.email);
          st.resendAt = Date.now() + RECOVERY_RESEND_MS;
          alertEl.innerHTML = alertHtml('success', 'A new code is on its way. Use the newest one — earlier codes stop working.');
          stopTicker(); paintResend();
          ticker = setInterval(()=>{ if(!document.body.contains(resendBtn)) stopTicker(); else paintResend(); }, 1000);
        }catch(err){
          alertEl.innerHTML = alertHtml('error', err.message);
          paintResend();
        }
      });
      document.getElementById('fpChangeEmail').addEventListener('click', ()=>{ st.step = 'email'; paint(); });

      document.getElementById('fpCodeForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const code = codeInput.value.trim();
        const alertEl = document.getElementById('fpAlert');
        if(!/^\d{6,10}$/.test(code)){ alertEl.innerHTML = alertHtml('error', 'Enter the code from the email — it\'s at least 6 digits.'); return; }
        const btn = document.getElementById('fpVerifyBtn');
        btn.disabled = true; btn.textContent = 'Checking…';
        try{
          st.verified = await authVerifyRecoveryCode(st.email, code);
          if(!st.verified || !st.verified.access_token) throw new Error('That code is incorrect or has expired.');
          st.step = 'password';
          paint();
        }catch(err){
          alertEl.innerHTML = alertHtml('error', err.message);
          btn.disabled = false; btn.textContent = 'Verify Code';
          codeInput.select();
        }
      });
      return;
    }

    if(st.step === 'password'){
      app.innerHTML = topbarHtml('#/account') + `
        <div class="hero auth-hero">${stepsHtml('password')}
          <h1 style="font-size:28px;">Choose a New Password</h1>
          <p>Code verified for <b>${escapeHtml(st.email)}</b>. Pick a new password to finish.</p>
        </div>
        <div id="fpAlert"></div>
        <form id="fpPasswordForm" class="auth-card" novalidate>
          <input type="email" value="${escapeHtml(st.email)}" autocomplete="username" hidden>
          <div class="form-group"><label class="form-label" for="fpNew">New Password</label>
            <input class="form-input" type="password" id="fpNew" autocomplete="new-password" placeholder="At least 6 characters" required></div>
          <div class="form-group"><label class="form-label" for="fpConfirm">Confirm New Password</label>
            <input class="form-input" type="password" id="fpConfirm" autocomplete="new-password" required></div>
          <button type="submit" class="primary-btn" id="fpSaveBtn">Save New Password</button>
        </form>`;
      document.getElementById('fpNew').focus();
      document.getElementById('fpPasswordForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const pw = document.getElementById('fpNew').value;
        const confirmPw = document.getElementById('fpConfirm').value;
        const alertEl = document.getElementById('fpAlert');
        if(pw.length < 6){ alertEl.innerHTML = alertHtml('error', 'Your password needs at least 6 characters.'); return; }
        if(pw !== confirmPw){ alertEl.innerHTML = alertHtml('error', "Those passwords don't match."); return; }
        const btn = document.getElementById('fpSaveBtn');
        btn.disabled = true; btn.textContent = 'Saving…';
        try{
          await authSetPassword(st.verified.access_token, pw);
          saveSession(sessionFromAuth(st.verified, st.email));
          st.verified = null;
          st.step = 'done';
          paint();
        }catch(err){
          alertEl.innerHTML = alertHtml('error', err.message);
          btn.disabled = false; btn.textContent = 'Save New Password';
        }
      });
      return;
    }

    // done
    app.innerHTML = topbarHtml() + `
      <div class="hero auth-hero">${stepsHtml('done')}
        <h1 style="font-size:28px;">Password Updated</h1>
        <p>You're logged in as <b>${escapeHtml(st.email)}</b>. Use your new password next time.</p>
      </div>
      <a class="primary-btn" href="${destination || '#/account'}">${destination ? 'Continue' : 'Go to My Leagues'}</a>`;
  }

  if(session){
    app.innerHTML = topbarHtml('#/') + `
      <div class="hero auth-hero"><h1 style="font-size:28px;">Reset Your Password</h1>
        <p>You're currently logged in as <b>${escapeHtml(session.email)}</b>. Log out first to reset the password for an account.</p></div>
      <button type="button" class="primary-btn" id="fpLogout">Log Out and Continue</button>`;
    document.getElementById('fpLogout').addEventListener('click', ()=>{ saveSession(null); paint(); });
    return;
  }
  paint();
}

// Secret columns (invite codes, email) aren't readable, so never select "*".
const LEAGUE_COLUMNS = 'id,name,slug,commissioner_id,num_divisions,playoff_length_weeks,playoff_advance_count,is_public,finalized,created_at,sport,format,hosting';
const DIVISION_COLUMNS = 'id,league_id,name,platform,external_league_id,sort_order,commissioner_id';

async function getLeagueBySlug(slug){
  const builtin = builtinBySlug(slug);
  if(builtin) return builtin;
  const rows = await sbFetch(`/rest/v1/leagues?slug=eq.${encodeURIComponent(slug)}&select=${LEAGUE_COLUMNS}`);
  return rows && rows[0] ? rows[0] : null;
}
async function getDivisions(leagueId){
  const builtin = builtinById(leagueId);
  if(builtin) return builtin.divisions;
  return sbFetch(`/rest/v1/divisions?league_id=eq.${leagueId}&select=${DIVISION_COLUMNS}&order=sort_order.asc`);
}

async function renderLeagueRoute(app, r){
  app.innerHTML = topbarHtml('#/') + `<div class="state-msg">Loading league…</div>`;
  const league = await getLeagueBySlug(r.slug);
  if(!league){
    app.innerHTML = topbarHtml('#/') + `
      <div class="alert info">This league doesn't exist, or it's private and you haven't joined it yet.${session ? '' : ` If you're a member, <a href="${loginHref()}" style="text-decoration:underline;">log in</a> first.`}</div>
      <a class="action-card" href="#/join" style="display:block;max-width:360px;">
        <div class="ac-title">Join a Private League</div>
        <div class="ac-sub">Enter the invite code your commissioner shared with you.</div>
      </a>`;
    return;
  }
  const divisions = await getDivisions(league.id);

  if(r.sub==='superbracket') return renderSuperBracketPage(app, league, divisions);
  if(r.sub==='manage') return renderManage(app, league, divisions);
  // A single-division league has no overview of its own: the league is the division.
  if(league.format === 'single' && divisions.length){
    const tab = r.sub==='division' ? r.tab : r.sub;
    return renderHostedDivision(app, league, divisions, divisions[0], tab);
  }
  if(r.sub==='division' && r.arg) return renderDivisionPage(app, league, divisions, r.arg, r.tab);
  return renderLeagueHome(app, league, divisions);
}
